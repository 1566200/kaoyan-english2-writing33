   单页应用，hash 路由，离线可用，数据全部来自 window.KY
   ============================================================ */

(function () {
  "use strict";

  const K = window.KY || {};
  // 把“预测 20 篇”和 PDF 冲刺句合并进主数据，页面不需要区分来源
  if (Array.isArray(K.predictAEssays) && K.predictAEssays.length) {
    K.partAEssays = (K.partAEssays || []).concat(K.predictAEssays);
  }
  if (Array.isArray(K.predictBEssays) && K.predictBEssays.length) {
    K.partBEssays = (K.partBEssays || []).concat(K.predictBEssays);
  }
  if (Array.isArray(K.pdfSentences) && K.pdfSentences.length) {
    K.sentences = K.pdfSentences.concat(K.sentences || []);
  }
  const meta = K.meta || {};
  const hasData = !!(K.tenses && K.sentences && K.partAEssays && K.partBEssays);

  /* ---------------- 基础工具 ---------------- */

  const $ = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

  function esc(value) {
    return String(value == null ? "" : value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function icon(name, cls) {
    return '<svg class="icon ' + (cls || "") + '" aria-hidden="true"><use href="#i-' + name + '"></use></svg>';
  }

  function slotify(text, keepNewlines) {
    let out = esc(text);
    out = out.replace(/\[([^\]]+)\]/g, '<span class="slot">[$1]</span>');
    if (!keepNewlines) out = out.replace(/\n/g, "<br>");
    return out;
  }

  function plain(text) {
    return String(text || "").replace(/\[([^\]]+)\]/g, "$1").replace(/\s+/g, " ").trim();
  }

  function debounce(fn, wait) {
    let t;
    return function () {
      const args = arguments;
      clearTimeout(t);
      t = setTimeout(function () { fn.apply(null, args); }, wait);
    };
  }

  function clamp(n, min, max) { return Math.max(min, Math.min(max, n)); }

  function wordCountFromParagraphs(paragraphs) {
    if (!Array.isArray(paragraphs)) return 0;
    const text = paragraphs.map(function (p) { return p.en || ""; }).join(" ");
    // 与考试字数口径接近：数字、百分比也各算一个词
    return text.split(/\s+/).filter(function (token) { return /[A-Za-z0-9]/.test(token); }).length;
  }

  function todayKey() {
    const d = new Date();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return d.getFullYear() + "-" + m + "-" + day;
  }

  function dateLabel(d) {
    const week = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];
    return (d.getMonth() + 1) + "月" + d.getDate() + "日 · " + week[d.getDay()];
  }

  function daysUntil(dateString) {
    const target = new Date(dateString).getTime();
    if (isNaN(target)) return null;
    const now = Date.now();
    return Math.ceil((target - now) / 86400000);
  }

  function getStreak(dates) {
    if (!Array.isArray(dates) || !dates.length) return 0;
    const set = new Set(dates);
    const cursor = new Date();
    if (!set.has(todayKey())) cursor.setDate(cursor.getDate() - 1);
    let count = 0;
    for (let i = 0; i < 370; i++) {
      const key = cursor.getFullYear() + "-" +
        String(cursor.getMonth() + 1).padStart(2, "0") + "-" +
        String(cursor.getDate()).padStart(2, "0");
      if (!set.has(key)) break;
      count++;
      cursor.setDate(cursor.getDate() - 1);
    }
    return count;
  }

  /* ---------------- 学习状态 ---------------- */

  const STORE_KEY = "kyWriting.v1";
  const defaultState = {
    favorites: [],
    learnedSentences: [],
    learnedEssays: [],
    quizBest: {},
    tasks: {},
    activeDates: [],
    activity: {},
    drill: {},
    wrong: {},
    daily: {}
  };

  function loadState() {
    try {
      const raw = JSON.parse(localStorage.getItem(STORE_KEY) || "{}");
      return Object.assign({}, defaultState, raw, {
        favorites: Array.isArray(raw.favorites) ? raw.favorites : [],
        learnedSentences: Array.isArray(raw.learnedSentences) ? raw.learnedSentences : [],
        learnedEssays: Array.isArray(raw.learnedEssays) ? raw.learnedEssays : [],
        quizBest: raw.quizBest && typeof raw.quizBest === "object" ? raw.quizBest : {},
        tasks: raw.tasks && typeof raw.tasks === "object" ? raw.tasks : {},
        activeDates: Array.isArray(raw.activeDates) ? raw.activeDates : [],
        activity: raw.activity && typeof raw.activity === "object" ? raw.activity : {},
        drill: raw.drill && typeof raw.drill === "object" ? raw.drill : {},
        wrong: raw.wrong && typeof raw.wrong === "object" ? raw.wrong : {},
        daily: raw.daily && typeof raw.daily === "object" ? raw.daily : {}
      });
    } catch (e) {
      return Object.assign({}, defaultState);
    }
  }

  let state = loadState();

  function saveState() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* file:// 隐私模式忽略 */ }
  }

  function recordActivity(count) {
    const key = todayKey();
    state.activity[key] = (state.activity[key] || 0) + Math.max(1, Number(count) || 1);
    if (state.activeDates.indexOf(key) === -1) state.activeDates.push(key);
    // 只保留最近 180 天
    const keys = Object.keys(state.activity).sort();
    while (keys.length > 180) delete state.activity[keys.shift()];
    if (state.activeDates.length > 180) state.activeDates = state.activeDates.slice(-180);
    saveState();
  }

  function isFavorite(id) { return state.favorites.indexOf(id) !== -1; }
  function toggleFavorite(id) {
    const i = state.favorites.indexOf(id);
    if (i === -1) state.favorites.push(id); else state.favorites.splice(i, 1);
    saveState();
    return i === -1;
  }
  function isSentenceLearned(id) { return state.learnedSentences.indexOf(id) !== -1; }
  function toggleSentenceLearned(id) {
    const i = state.learnedSentences.indexOf(id);
    if (i === -1) state.learnedSentences.push(id); else state.learnedSentences.splice(i, 1);
    saveState();
    if (i === -1) recordActivity(2);
    refreshShell();
    return i === -1;
  }
  function isEssayLearned(id) { return state.learnedEssays.indexOf(id) !== -1; }
  function toggleEssayLearned(id) {
    const i = state.learnedEssays.indexOf(id);
    if (i === -1) state.learnedEssays.push(id); else state.learnedEssays.splice(i, 1);
    saveState();
    if (i === -1) recordActivity(5);
    refreshShell();
    return i === -1;
  }

  function todayTasks() {
    const key = todayKey();
    return Object.assign({}, state.tasks[key] || {});
  }
  function setTask(id, done) {
    const key = todayKey();
    const tasks = Object.assign({}, state.tasks[key] || {});
    tasks[id] = !!done;
    state.tasks[key] = tasks;
    // 只保留最近 90 天，避免 localStorage 变大
    const keys = Object.keys(state.tasks).sort();
    while (keys.length > 90) delete state.tasks[keys.shift()];
    if (done) recordActivity(1); else saveState();
    refreshShell();
  }
  function todayDoneCount() {
    const t = todayTasks();
    return ["grammar", "sentence", "write"].filter(function (id) { return t[id]; }).length;
  }

  /* ---------------- 题库 / 打卡数据 ---------------- */

  const SKILL_GROUPS = [
    { key: "tense", label: "时态", types: ["时态"] },
    { key: "clause", label: "从句", types: ["从句"] },
    { key: "writing", label: "写作基础", types: ["写作三大件", "写作基础"] },
    { key: "pattern", label: "句型", types: ["句型填空", "句型"] },
    { key: "translation", label: "翻译与挑错", types: ["翻译选择", "挑错"] },
    { key: "logic", label: "作文逻辑", types: ["作文逻辑"] }
  ];

  function allQuestions() {
    return (K.grammarQuiz || []).concat(K.sentenceQuiz || []).concat(K.drillExtra || []).filter(function (q) {
      return q && q.id && q.question && Array.isArray(q.options) && q.options.length === 4 &&
        Number.isInteger(q.answer) && q.answer >= 0 && q.answer < 4;
    });
  }

  function questionById(id) {
    return allQuestions().find(function (q) { return q.id === id; });
  }

  function questionGroup(type) {
    return SKILL_GROUPS.find(function (g) { return g.types.indexOf(type) !== -1; }) || { key: "other", label: "其他", types: [] };
  }

  function dayNumber() {
    const now = new Date();
    const start = new Date(now.getFullYear(), 0, 0);
    return Math.floor((now - start) / 86400000);
  }

  function dailyQuestions() {
    const list = allQuestions().slice();
    let seed = dayNumber() * 9301 + 49297;
    function rand() {
      seed = (seed * 9301 + 49297) % 233280;
      return seed / 233280;
    }
    for (let i = list.length - 1; i > 0; i--) {
      const j = Math.floor(rand() * (i + 1));
      const t = list[i]; list[i] = list[j]; list[j] = t;
    }
    return list.slice(0, 5);
  }

  function todayDailyState() {
    return state.daily[todayKey()] || null;
  }

  function markDailyDone(correct, total) {
    state.daily[todayKey()] = { done: true, correct: correct, total: total };
    const keys = Object.keys(state.daily).sort();
    while (keys.length > 90) delete state.daily[keys.shift()];
    saveState();
  }

  function recordAnswer(q, correct) {
    if (!q) return null;
    const d = state.drill[q.id] || { attempts: 0, correct: 0 };
    d.attempts += 1;
    if (correct) d.correct += 1;
    d.lastAt = Date.now();
    d.lastCorrect = !!correct;
    state.drill[q.id] = d;

    if (!correct) {
      const w = state.wrong[q.id] || { count: 0, streak: 0 };
      w.count += 1;
      w.streak = 0;
      w.lastAt = Date.now();
      state.wrong[q.id] = w;
    } else if (state.wrong[q.id]) {
      const w = state.wrong[q.id];
      w.streak = (w.streak || 0) + 1;
      w.lastAt = Date.now();
      // 连续答对两次，移出错题本
      if (w.streak >= 2) delete state.wrong[q.id];
      else state.wrong[q.id] = w;
    }
    recordActivity(1);
    return d;
  }

  function wrongQuestions() {
    return Object.keys(state.wrong || {}).map(questionById).filter(Boolean);
  }

  function questionStats() {
    const list = allQuestions();
    let attempts = 0, correct = 0, attempted = 0, mastered = 0;
    list.forEach(function (q) {
      const d = state.drill[q.id];
      if (!d) return;
      attempts += d.attempts || 0;
      correct += d.correct || 0;
      if (d.attempts) attempted += 1;
      if ((d.correct || 0) >= 2) mastered += 1;
    });
    return {
      total: list.length,
      attempted: attempted,
      attempts: attempts,
      correct: correct,
      accuracy: attempts ? Math.round(correct / attempts * 100) : 0,
      mastered: mastered,
      wrong: wrongQuestions().length
    };
  }

  function categoryStats() {
    const list = allQuestions();
    return SKILL_GROUPS.map(function (g) {
      const qs = list.filter(function (q) { return g.types.indexOf(q.type) !== -1; });
      let correct = 0, attempts = 0, mastered = 0;
      qs.forEach(function (q) {
        const d = state.drill[q.id];
        if (!d) return;
        attempts += d.attempts || 0;
        correct += d.correct || 0;
        if ((d.correct || 0) >= 2) mastered += 1;
      });
      return {
        key: g.key, label: g.label, total: qs.length, attempts: attempts,
        accuracy: attempts ? Math.round(correct / attempts * 100) : 0,
        mastered: mastered
      };
    });
  }

  function totalActivity() {
    return Object.keys(state.activity || {}).reduce(function (sum, k) { return sum + (state.activity[k] || 0); }, 0);
  }

  function achievements() {
    const stats = questionStats();
    const streak = getStreak(state.activeDates);
    const acts = totalActivity();
    return [
      { id: "first", title: "第一步", desc: "完成第一次学习动作", ok: acts > 0, icon: "spark" },
      { id: "streak3", title: "连击 3 天", desc: "连续学习 3 天", ok: streak >= 3, icon: "target" },
      { id: "streak7", title: "一周不断", desc: "连续学习 7 天", ok: streak >= 7, icon: "clock" },
      { id: "sent10", title: "句子入门", desc: "标记背会 10 个功能句", ok: state.learnedSentences.length >= 10, icon: "quote" },
      { id: "sent30", title: "句库过半", desc: "标记背会 30 个功能句", ok: state.learnedSentences.length >= 30, icon: "quote" },
      { id: "essay5", title: "范文 5 篇", desc: "精背 5 篇整篇范文", ok: state.learnedEssays.length >= 5, icon: "book" },
      { id: "drill20", title: "刷题 20", desc: "累计正确回答 20 道题", ok: stats.correct >= 20, icon: "check" },
      { id: "accuracy80", title: "稳定输出", desc: "刷题正确率达到 80%", ok: stats.attempts >= 10 && stats.accuracy >= 80, icon: "target" }
    ];
  }

  function dateKeyOf(d) {
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }

  function heatmapHtml(weeks, compact) {
    weeks = weeks || 16;
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const end = new Date(today);
    end.setDate(end.getDate() + (6 - end.getDay())); // 周六收尾
    const start = new Date(end);
    start.setDate(end.getDate() - weeks * 7 + 1); // 周日开始
    const current = dateKeyOf(today);
    const activeSet = new Set(state.activeDates || []);
    let cells = "";
    for (let i = 0; i < weeks * 7; i++) {
      const d = new Date(start);
      d.setDate(start.getDate() + i);
      const key = dateKeyOf(d);
      const count = (state.activity && state.activity[key]) || (activeSet.has(key) ? 1 : 0);
      let lv = 0;
      if (count >= 10) lv = 4;
      else if (count >= 6) lv = 3;
      else if (count >= 3) lv = 2;
      else if (count >= 1) lv = 1;
      cells += '<span class="heat-cell lv-' + lv + (key === current ? " is-today" : "") + '" title="' + esc(key) + " · " + count + ' 次学习"></span>';
    }
    return '<div class="heatmap' + (compact ? " heatmap-compact" : "") + '" role="img" aria-label="最近 ' + weeks + ' 周学习打卡热力图">' +
      '<div class="heatmap-weekdays"><span></span><span>一</span><span></span><span>三</span><span></span><span>五</span><span></span></div>' +
      '<div class="heatmap-body"><div class="heatmap-grid">' + cells + '</div>' +
      '<div class="heatmap-legend"><span>' + (compact ? "" : "少") + '</span><i class="heat-cell lv-0"></i><i class="heat-cell lv-1"></i><i class="heat-cell lv-2"></i><i class="heat-cell lv-3"></i><i class="heat-cell lv-4"></i><span>' + (compact ? "" : "多") + '</span></div></div></div>';
  }

  /* ---------------- 复制 / toast / modal ---------------- */

  let toastTimer = null;
  function toast(message) {
    const el = $("#toast");
    if (!el) return;
    el.textContent = message;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove("show"); }, 1900);
  }

  function copyText(text, message) {
    const done = function () { toast(message || "已复制，去作文里替换主题词吧"); };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(done).catch(function () { fallbackCopy(text); done(); });
    } else {
      fallbackCopy(text); done();
    }
  }

  function speak(text) {
    if (!("speechSynthesis" in window) || !text) { toast("当前浏览器不支持朗读，建议用 Edge/Chrome"); return; }
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(String(text).replace(/\[([^\]]+)\]/g, "$1"));
    utter.lang = "en-US";
    utter.rate = 0.86;
    const voices = window.speechSynthesis.getVoices ? window.speechSynthesis.getVoices() : [];
    const enVoice = voices.find(function (v) { return /^en[-_]/i.test(v.lang); });
    if (enVoice) utter.voice = enVoice;
    window.speechSynthesis.speak(utter);
    toast("正在朗读，可再点一次停止");
  }

  function stopSpeaking() {
    if ("speechSynthesis" in window) window.speechSynthesis.cancel();
  }

  function fallbackCopy(text) {
    try {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.left = "-9999px";
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
    } catch (e) { toast("复制失败，请手动选择文本"); }
  }

  let lastFocused = null;
  let flashcardKeyHandler = null;
  function openModal(html, options) {
    options = options || {};
    const root = $("#modal-root");
    if (!root) return;
    lastFocused = document.activeElement;
    root.innerHTML =
      '<div class="modal-backdrop" data-modal-backdrop>' +
        '<div class="modal ' + (options.wide ? "modal-wide" : "") + '" role="dialog" aria-modal="true" aria-label="' + esc(options.label || "详情") + '">' +
          '<button class="icon-btn modal-close" type="button" data-close-modal aria-label="关闭">' + icon("close") + '</button>' +
          html +
        '</div>' +
      '</div>';
    document.body.style.overflow = "hidden";
    const closeBtn = $(".modal-close", root);
    if (closeBtn) closeBtn.focus();
    const backdrop = $("[data-modal-backdrop]", root);
    if (backdrop) {
      backdrop.addEventListener("click", function (e) {
        if (e.target === backdrop) closeModal();
      });
    }
    $$("[data-close-modal]", root).forEach(function (btn) {
      btn.addEventListener("click", closeModal);
    });
  }

  function closeModal() {
    const root = $("#modal-root");
    if (!root || !root.innerHTML) return;
    if (flashcardKeyHandler) {
      document.removeEventListener("keydown", flashcardKeyHandler);
      flashcardKeyHandler = null;
    }
    root.innerHTML = "";
    document.body.style.overflow = "";
    if (lastFocused && typeof lastFocused.focus === "function") lastFocused.focus();
    lastFocused = null;
  }

  /* ---------------- 常量 / 小渲染件 ---------------- */

  const LEVEL_CLASS = { "核心必背": "badge-core", "可替换": "badge-swap", "加分": "badge-plus" };
  const CHART_COLORS = ["#2c6a57", "#e2a72d", "#c96145", "#3d6982", "#6f5a86"];

  function levelBadge(level) {
    return '<span class="badge ' + (LEVEL_CLASS[level] || "badge-muted") + '">' + esc(level) + '</span>';
  }

  function sectionHead(title, desc, linkHref, linkText) {
    return '<div class="section-head"><div><h2>' + esc(title) + '</h2>' +
      (desc ? '<p>' + esc(desc) + '</p>' : "") + '</div>' +
      (linkHref ? '<a class="section-link" href="' + linkHref + '">' + esc(linkText || "查看全部") + icon("arrow-right") + '</a>' : "") +
      '</div>';
  }

  function emptyState(title, desc, href, link) {
    return '<div class="empty-state"><strong>' + esc(title) + '</strong>' + esc(desc) +
      (href ? '<br><a class="btn btn-primary btn-sm" href="' + href + '">' + esc(link || "去看看") + '</a>' : "") +
      '</div>';
  }

  function getSentence(id) {
    return (K.sentences || []).find(function (s) { return s.id === id; });
  }

  function randomSentence() {
    const list = K.sentences || [];
    if (!list.length) return null;
    return list[Math.floor(Math.random() * list.length)];
  }

  function sentenceForToday() {
    const list = K.sentences || [];
    if (!list.length) return null;
    const now = new Date();
    const start = new Date(now.getFullYear(), 0, 0);
    const day = Math.floor((now - start) / 86400000);
    return list[day % list.length];
  }

  function findEssay(id) {
    const all = (K.partAEssays || []).concat(K.partBEssays || []);
    return all.find(function (e) { return e.id === id; });
  }

  function allEssays() {
    return (K.partAEssays || []).concat(K.partBEssays || []);
  }

  /* ---------------- 图表渲染 ---------------- */

  function niceMax(value) {
    if (!isFinite(value) || value <= 0) return 10;
    const power = Math.pow(10, Math.floor(Math.log(value) / Math.LN10));
    const n = value / power;
    let step;
    if (n <= 1) step = 1; else if (n <= 2) step = 2; else if (n <= 5) step = 5; else step = 10;
    return step * power;
  }

  function shortLabel(label, max) {
    const s = String(label);
    return s.length > max ? s.slice(0, max - 1) + "…" : s;
  }

  function wrapLabel(label, maxChars) {
    const words = String(label).split(/\s+/);
    const lines = [];
    let line = "";
    words.forEach(function (w) {
      if ((line + " " + w).trim().length > maxChars && line) {
        lines.push(line);
        line = w;
      } else {
        line = (line + " " + w).trim();
      }
    });
    if (line) lines.push(line);
    return lines.slice(0, 2);
  }

  function svgAxis(maxValue, left, right, top, bottom, unit) {
    let out = "";
    for (let i = 0; i <= 4; i++) {
      const y = top + (bottom - top) * i / 4;
      const val = Math.round(maxValue - maxValue * i / 4);
      out += '<line x1="' + left + '" y1="' + y + '" x2="' + right + '" y2="' + y + '" stroke="#e5ddcc" stroke-width="1"/>';
      out += '<text x="' + (left - 9) + '" y="' + (y + 3.5) + '" text-anchor="end" font-size="10" fill="#5f6961">' + val + '</text>';
    }
    if (unit) {
      out += '<text x="' + left + '" y="' + (top - 12) + '" font-size="9.5" fill="#5f6961">' + esc(unit) + '</text>';
    }
    return out;
  }

  function chartLegend(series) {
    return '<div class="chart-legend">' + series.map(function (s, i) {
      return '<span><i style="background:' + CHART_COLORS[i % CHART_COLORS.length] + '"></i>' + esc(s.name) + '</span>';
    }).join("") + '</div>';
  }

  function renderChart(chart) {
    if (!chart) return "";
    const type = chart.type || "bar";
    const title = chart.title || "";
    const note = chart.note || "模拟数据，仅用于写作练习。";

    if (type === "table") {
      const headers = chart.headers || [];
      const rows = chart.rows || [];
      return '<div class="chart-card panel">' +
        '<div class="chart-card-head"><div><h3>' + esc(title) + '</h3><p>图表数据 · 表格</p></div></div>' +
        '<div class="table-shell"><table class="chart-table"><thead><tr>' +
        headers.map(function (h) { return "<th>" + esc(h) + "</th>"; }).join("") +
        '</tr></thead><tbody>' +
        rows.map(function (r) { return "<tr>" + r.map(function (c) { return "<td>" + esc(c) + "</td>"; }).join("") + "</tr>"; }).join("") +
        '</tbody></table></div>' +
        '<p class="chart-note">' + esc(note) + '</p></div>';
    }

    if (type === "pie") {
      const values = (chart.series && chart.series[0] && chart.series[0].values) || [];
      const cats = chart.categories || [];
      const total = values.reduce(function (a, b) { return a + Number(b); }, 0) || 1;
      const cx = 250, cy = 170, r = 108;
      let angle = -Math.PI / 2;
      let paths = "";
      values.forEach(function (v, i) {
        const part = Number(v) / total;
        const next = angle + part * Math.PI * 2;
        const x1 = cx + r * Math.cos(angle), y1 = cy + r * Math.sin(angle);
        const x2 = cx + r * Math.cos(next), y2 = cy + r * Math.sin(next);
        const large = part > 0.5 ? 1 : 0;
        paths += '<path d="M' + cx + ' ' + cy + ' L' + x1.toFixed(2) + ' ' + y1.toFixed(2) +
          ' A' + r + ' ' + r + ' 0 ' + large + ' 1 ' + x2.toFixed(2) + ' ' + y2.toFixed(2) +
          ' Z" fill="' + CHART_COLORS[i % CHART_COLORS.length] + '" stroke="#fffdf7" stroke-width="2"/>';
        if (part >= 0.06) {
          const mid = angle + part * Math.PI;
          const tx = cx + r * 0.66 * Math.cos(mid), ty = cy + r * 0.66 * Math.sin(mid);
          paths += '<text x="' + tx.toFixed(1) + '" y="' + ty.toFixed(1) + '" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">' + Math.round(part * 100) + '%</text>';
        }
        angle = next;
      });
      const legend = '<div class="chart-legend">' + cats.map(function (c, i) {
        return '<span><i style="background:' + CHART_COLORS[i % CHART_COLORS.length] + '"></i>' + esc(c) + ' ' + esc(values[i]) + (chart.unit === "%" ? "%" : "") + '</span>';
      }).join("") + '</div>';
      return '<div class="chart-card panel"><div class="chart-card-head"><div><h3>' + esc(title) + '</h3><p>图表数据 · 饼图</p></div></div>' +
        '<div class="chart-wrap"><svg class="chart-svg" viewBox="0 0 720 340" role="img" aria-label="' + esc(title) + '">' + paths + '</svg></div>' +
        legend + '<p class="chart-note">' + esc(note) + '</p></div>';
    }

    const series = chart.series || [];
    const cats = chart.categories || [];
    const left = 58, right = 700, top = 34, bottom = 278;
    const plotW = right - left, plotH = bottom - top;
    let maxVal = 0;
    series.forEach(function (s) { (s.values || []).forEach(function (v) { maxVal = Math.max(maxVal, Number(v)); }); });
    const max = niceMax(maxVal * 1.12);
    let svg = '<svg class="chart-svg" viewBox="0 0 720 360" role="img" aria-label="' + esc(title) + '">';
    svg += svgAxis(max, left, right, top, bottom, chart.unit || "");
    svg += '<line x1="' + left + '" y1="' + bottom + '" x2="' + right + '" y2="' + bottom + '" stroke="#c9bda6" stroke-width="1.2"/>';

    const group = plotW / Math.max(cats.length, 1);
    if (type === "line") {
      series.forEach(function (s, si) {
        const vals = s.values || [];
        const pts = vals.map(function (v, i) {
          const x = left + group * (i + 0.5);
          const y = bottom - (Number(v) / max) * plotH;
          return [x, y];
        });
        svg += '<polyline fill="none" stroke="' + CHART_COLORS[si % CHART_COLORS.length] + '" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" points="' +
          pts.map(function (p) { return p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" ") + '"/>';
        pts.forEach(function (p, i) {
          svg += '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="4" fill="#fffdf7" stroke="' + CHART_COLORS[si % CHART_COLORS.length] + '" stroke-width="2.5"/>';
          if (si === 0) {
            svg += '<text x="' + p[0].toFixed(1) + '" y="' + (p[1] - 12).toFixed(1) + '" text-anchor="middle" font-size="10" font-weight="600" fill="#30423a">' + vals[i] + '</text>';
          }
        });
      });
    } else {
      const barW = Math.min(30, (group * 0.62) / Math.max(series.length, 1));
      const totalW = barW * series.length;
      cats.forEach(function (cat, i) {
        series.forEach(function (s, si) {
          const v = Number((s.values || [])[i] || 0);
          const h = (v / max) * plotH;
          const x = left + group * (i + 0.5) - totalW / 2 + si * barW;
          const y = bottom - h;
          svg += '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + (barW - 2) + '" height="' + h.toFixed(1) + '" rx="3" fill="' + CHART_COLORS[si % CHART_COLORS.length] + '"/>';
          if (series.length <= 2) {
            svg += '<text x="' + (x + barW / 2 - 1).toFixed(1) + '" y="' + (y - 5).toFixed(1) + '" text-anchor="middle" font-size="8.5" fill="#5f6961">' + v + '</text>';
          }
        });
        const lines = wrapLabel(cat, 17);
        const baseX = left + group * (i + 0.5);
        lines.forEach(function (line, li) {
          svg += '<text x="' + baseX.toFixed(1) + '" y="' + (bottom + 18 + li * 13) + '" text-anchor="middle" font-size="9.5" fill="#5f6961">' + esc(line) + '</text>';
        });
      });
    }
    svg += '</svg>';
    return '<div class="chart-card panel"><div class="chart-card-head"><div><h3>' + esc(title) + '</h3><p>图表数据 · ' +
      (type === "line" ? "折线图" : "柱状图") + '</p></div></div><div class="chart-wrap">' + svg + '</div>' +
      chartLegend(series) + '<p class="chart-note">' + esc(note) + '</p></div>';
  }

  function parseRoute() {
    const raw = (location.hash || "").replace(/^#\/?/, "").trim();
    if (!raw) return { name: "home", param: "", target: "" };
    const hashAt = raw.indexOf("#");
    const routePart = hashAt === -1 ? raw : raw.slice(0, hashAt);
    const target = hashAt === -1 ? "" : raw.slice(hashAt + 1);
    const bits = routePart.split("/").filter(Boolean);
    return { name: bits[0] || "home", param: bits.slice(1).join("/"), target: target };
  }

  function setActiveNav(name) {
    $$("[data-nav]").forEach(function (a) {
      const isActive = a.getAttribute("data-nav") === name;
      a.classList.toggle("active", isActive);
      if (isActive) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
    });
  }

  function refreshShell() {
    const route = ROUTES[currentRoute] || ROUTES.home;
    const title = currentParam && currentRoute === "essays" ? "范文详情" : route.title;
    $("#topbar-title").textContent = title;

    const done = todayDoneCount();

    if (ring) {
      ring.style.setProperty("--p", pct);

    }
    const taskText = $("#sidebar-task-text");
    if (taskText) {
      const streak = getStreak(state.activeDates);
      const base = done === total ? "今天完成了，明天继续" : done === 0 ? "还没开始，先做 5 分钟" : "还差 " + (total - done) + " 件，别贪多";
      taskText.textContent = base + (streak > 0 ? " · 连续 " + streak + " 天" : "");
    }
    $("#topbar-progress-text").textContent = done + "/" + total;

    const days = daysUntil(meta.examDate);
    const cd = $("#countdown-days");
    if (cd) cd.textContent = days === null ? "--" : days > 0 ? days : "0";

    setActiveNav(currentRoute);

  function renderRoute() {
    const parsed = parseRoute();
    let name = parsed.name;
    if (!ROUTES[name]) name = "home";
    if (pageCleanup) { try { pageCleanup(); } catch (e) { /* ignore */ } pageCleanup = null; }
    stopSpeaking();
    currentRoute = name;
    currentParam = parsed.param;
    closeModal();
    closeSidebar();

    const view = $("#view");
    if (!view) return;
    if (!hasData) {
      view.innerHTML = emptyState("数据没有加载成功", "请确认 data 文件夹与 index.html 在同一目录，且浏览器允许本地脚本运行。", "#/home", "重试");
      refreshShell();
      return;
    }
    const page = pages[name];
    let result;
    try {
      result = page ? page(currentParam) : pages.home("");
    } catch (err) {
      console.error(err);
      result = { html: '<div class="empty-state"><strong>这个页面出了点小问题</strong>请刷新页面，或从首页重新进入。<br><a class="btn btn-primary btn-sm" href="#/home">回首页</a></div>' };
    }
    if (typeof result === "string") result = { html: result };
    view.innerHTML = result.html;
    refreshShell();
    if (typeof result.after === "function") {
      requestAnimationFrame(function () { result.after(); });
    }
    if (parsed.target) {
      const target = document.getElementById(parsed.target);
      if (target) {
        requestAnimationFrame(function () { target.scrollIntoView({ behavior: "auto", block: "start" }); });
      }
    } else {
      window.scrollTo({ top: 0, behavior: "auto" });

  function openFlashcards(items, title, subtitle) {
    if (!items.length) { toast("这里还没有可背的内容"); return; }
    let index = 0;
    let flipped = false;

    function faceHtml() {
      const item = items[index];
      return '<div class="modal-head"><span class="eyebrow">' + esc(item.type || "抽背") + '</span>' +
        '<h2>' + esc(title) + '</h2><p>' + esc(subtitle) + '</p></div>' +
        '<div class="flashcard-stage"><div class="flashcard' + (flipped ? " flipped" : "") + '" data-flashcard tabindex="0" role="button" aria-label="点击翻面">' +
          '<div class="flashcard-inner">' +
            '<div class="flashcard-face flashcard-front"><span class="fc-label">先自己想</span>' +
              '<p class="fc-main">' + esc(item.front) + '</p>' +
              '<p class="fc-sub">' + esc(item.sub || "") + '</p>' +
              '<span class="flashcard-hint">点击卡片 / 空格键翻面</span>' +
            '</div>' +
            '<div class="flashcard-face flashcard-back"><span class="fc-label">对照答案</span>' +
              '<p class="fc-main">' + slotify(item.back || "", true) + '</p>' +
              '<p class="fc-sub">' + slotify(item.backSub || "") + '</p>' +
              '<span class="flashcard-hint">再点一次回到正面</span>' +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div class="flashcard-nav">' +
          '<span class="flashcard-progress">' + (index + 1) + " / " + items.length + '</span>' +
          '<div class="flashcard-buttons">' +
            '<button class="btn btn-secondary btn-sm" type="button" data-fc-prev>' + icon("arrow-left") + '上一张</button>' +
            '<button class="btn btn-primary btn-sm" type="button" data-fc-next>下一张' + icon("arrow-right") + '</button>' +
          '</div>' +
        '</div></div>';
    }

    function paint() {
      const modal = $(".modal");
      if (!modal) return;
      const head = modal.querySelector(".modal-head");
      const stage = modal.querySelector(".flashcard-stage");
      if (!head || !stage) return;
      head.outerHTML = faceHtml().split('<div class="flashcard-stage">')[0];
      const newStage = faceHtml().split('<div class="flashcard-stage">')[1];
      stage.outerHTML = '<div class="flashcard-stage">' + newStage;
      bind();
    }

    function bind() {
      const card = $("[data-flashcard]");
      if (card) {
        card.addEventListener("click", function () { flipped = !flipped; card.classList.toggle("flipped", flipped); });
        card.addEventListener("keydown", function (e) {
          if (e.key === " " || e.key === "Enter") { e.preventDefault(); flipped = !flipped; card.classList.toggle("flipped", flipped); }
        });
      }
      const prev = $("[data-fc-prev]");
      const next = $("[data-fc-next]");
      if (prev) prev.addEventListener("click", function () { index = (index - 1 + items.length) % items.length; flipped = false; paint(); });
      if (next) next.addEventListener("click", function () { index = (index + 1) % items.length; flipped = false; paint(); });
    }

    openModal(faceHtml(), { label: title, wide: false });
    bind();
    if (flashcardKeyHandler) document.removeEventListener("keydown", flashcardKeyHandler);
    flashcardKeyHandler = function (e) {
      if (!$(".flashcard")) {
        document.removeEventListener("keydown", flashcardKeyHandler);
        flashcardKeyHandler = null;
        return;
      }
      if (e.key === "ArrowLeft") { index = (index - 1 + items.length) % items.length; flipped = false; paint(); }
      if (e.key === "ArrowRight") { index = (index + 1) % items.length; flipped = false; paint(); }
    };
    document.addEventListener("keydown", flashcardKeyHandler);
  }

  function sentenceCategoryLabel(s) {
    if (!s.source) return s.category;
    return s.category.replace(/^小作文·/, "").replace(/^大作文·/, "");
  }

  function sentenceGroup(s) {
    if (!s.source) return s.category;
    const c = s.category;
    if (/小作文/.test(c)) {
      if (/自我介绍|寒暄|写信目的|通知开头|请求咨询|结尾致意/.test(c)) return "PDF·小作文开头结尾";
      if (/建议|邀请|活动|值得参加|未来展望/.test(c)) return "PDF·建议邀请";
      if (/感谢|道歉|忙碌/.test(c)) return "PDF·感谢道歉";
      return "PDF·小作文其他";
    }
    if (/图表开头|数据|比例|联系主题/.test(c)) return "PDF·图表描述";
    if (/原因|举例/.test(c)) return "PDF·原因分析";
    if (/建议|积极意义|展望|号召/.test(c)) return "PDF·建议展望";
    if (/图画|观点|对比|值得关注/.test(c)) return "PDF·图画材料";
    return "PDF·大作文其他";
  }

      '</div>' +
      '<p class="sentence-en">' + slotify(s.en) + '</p>' +
      '<p class="sentence-zh">' + esc(s.zh) + '</p>' +
      '<div class="sentence-tags">' + tagList((s.tags || []).slice(0, 4)) + '</div>' +

  pages.sentences = function () {
    const all = K.sentences || [];
    const categories = [];
    all.forEach(function (s) {
      const g = sentenceGroup(s);
      if (categories.indexOf(g) === -1) categories.push(g);
    });
    const filters = { q: "", level: "全部", cat: "全部", favOnly: false, pdfOnly: false };

    function filtered() {
      return all.filter(function (s) {
        if (filters.level !== "全部" && s.level !== filters.level) return false;
        if (filters.cat !== "全部" && sentenceGroup(s) !== filters.cat) return false;
        if (filters.pdfOnly && !s.source) return false;
        if (filters.favOnly && !isFavorite(s.id)) return false;
        if (filters.q) {
          const q = filters.q.toLowerCase();
          const hay = (s.en + " " + s.zh + " " + (s.tags || []).join(" ") + " " + (s.note || "") + " " + s.category).toLowerCase();
          if (hay.indexOf(q) === -1) return false;
        }
        return true;
      });
    }

    function gridHtml() {
      const list = filtered();
      if (!list.length) {
        return '<div class="empty-state"><strong>没有匹配的句子</strong>换个关键词，或把筛选条件清掉。<br><button class="btn btn-secondary btn-sm" type="button" data-reset-sentence-filter>清空筛选</button></div>';
      }
      return '<div class="sentence-grid" id="sentence-grid">' + list.map(sentenceCardHtml).join("") + '</div>';
    }

    function countText() {
      const n = filtered().length;
      return '显示 <b>' + n + '</b> / ' + all.length + ' 句';
    }

    const body =
      '<div class="callout tip mb-3">' + icon("bulb") + '<div><strong>先背 PDF 冲刺句，再补通用句：</strong>带“PDF冲刺”标记的 36 句，按你提供的《作文预测冲刺 20 篇》功能句改写，优先背。背的时候遮住英文，只看中文说一遍；说不出来就点“替换句”。考试时不需要每句都用，能用上 5 句就很够。</div></div>' +
      '<div class="toolbar">' +
        '<div class="search-field">' + icon("search") + '<input id="sentence-search" type="search" placeholder="搜中文、英文或语法点，例如：原因 / that / 图表" autocomplete="off" aria-label="搜索功能句"><button class="search-clear" type="button" data-clear-sentence-search aria-label="清空搜索">' + icon("close") + '</button></div>' +
        '<select class="select" id="sentence-category" aria-label="按功能筛选"><option value="全部">全部分类</option>' + categories.map(function (c) { return '<option value="' + esc(c) + '">' + esc(c) + '</option>'; }).join("") + '</select>' +
        '<div class="toolbar-right"><button class="btn btn-secondary btn-sm" type="button" data-open-sentence-flashcards>' + icon("play") + '闪卡背句</button><button class="btn btn-secondary btn-sm" type="button" data-random-sentence>' + icon("shuffle") + '随机一句</button></div>' +
      '</div>' +
      '<div class="toolbar" style="margin-top:-4px"><div class="chip-row" id="sentence-levels">' +
        ["全部", "核心必背", "可替换", "加分"].map(function (lv) {
          return '<button class="chip' + (lv === "全部" ? " active" : "") + '" type="button" data-sentence-level="' + lv + '">' + (lv === "全部" ? "全部" : lv) + '</button>';
        }).join("") +
        '<button class="chip" type="button" data-sentence-pdf-filter>' + icon("spark") + '只看 PDF 冲刺</button>' +
        '<button class="chip" type="button" data-sentence-fav-filter>' + icon("star") + '只看收藏</button>' +
      '</div><span class="result-count" id="sentence-count" style="margin-left:auto">' + countText() + '</span></div>' +
      '<div id="sentence-results">' + gridHtml() + '</div>';

    function refreshGrid() {
      const res = $("#sentence-results");
      if (res) res.innerHTML = gridHtml();
      const count = $("#sentence-count");
      if (count) count.innerHTML = countText();
    }

    function currentList() {
      return filtered();
    }

    return {
      html: pageHead("功能句库", "先背 PDF 冲刺句，再补通用句", (K.sentences || []).length + " 个能直接放进作文的功能句：60 句通用 + " + (K.pdfSentences || []).length + " 句按 PDF 改写。每句配 1–2 个同义替换，基础差也能找到顺口的那一句。",
        '<button class="btn btn-secondary" type="button" data-open-sentence-flashcards>' + icon("play") + '闪卡背句</button><a class="btn btn-primary" href="#/templates">' + icon("layout") + '套进模板</a>') + body,
      after: function () {
        const search = $("#sentence-search");
        const cat = $("#sentence-category");
        if (search) {
          search.addEventListener("input", debounce(function () {
            filters.q = search.value.trim();
            refreshGrid();
          }, 120));
        }
        if (cat) cat.addEventListener("change", function () { filters.cat = cat.value; refreshGrid(); });
        $$("[data-sentence-level]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            filters.level = btn.getAttribute("data-sentence-level");
            $$("[data-sentence-level]").forEach(function (b) { b.classList.toggle("active", b === btn); });
            refreshGrid();
          });
        });
        $$("[data-sentence-fav-filter]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            filters.favOnly = !filters.favOnly;
            btn.classList.toggle("active", filters.favOnly);
            refreshGrid();
          });
        });
        $$("[data-sentence-pdf-filter]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            filters.pdfOnly = !filters.pdfOnly;
            btn.classList.toggle("active", filters.pdfOnly);
            refreshGrid();
          });
        });
        $$("[data-clear-sentence-search]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            filters.q = "";
            if (search) { search.value = ""; search.focus(); }
            refreshGrid();
          });
        });
        $$("[data-reset-sentence-filter]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            filters.q = ""; filters.level = "全部"; filters.cat = "全部"; filters.favOnly = false; filters.pdfOnly = false;
            if (search) search.value = "";
            if (cat) cat.value = "全部";
            $$("[data-sentence-level]").forEach(function (b) { b.classList.toggle("active", b.getAttribute("data-sentence-level") === "全部"); });
            const favBtn = $("[data-sentence-fav-filter]"); if (favBtn) favBtn.classList.remove("active");
            const pdfBtn = $("[data-sentence-pdf-filter]"); if (pdfBtn) pdfBtn.classList.remove("active");
            refreshGrid();
          });
        });

        // 事件委托：卡片内所有操作
        const results = $("#sentence-results");
        if (results) {
          results.addEventListener("click", function (e) {
            const card = e.target.closest(".sentence-card");
            if (!card) return;
            const id = card.getAttribute("data-sentence-id");
            const s = getSentence(id);
            if (!s) return;

            if (e.target.closest("[data-sentence-fav]")) {
              const active = toggleFavorite(id);
              e.target.closest("[data-sentence-fav]").classList.toggle("active", active);
              e.target.closest("[data-sentence-fav]").setAttribute("aria-pressed", String(active));
              if (filters.favOnly) refreshGrid();
              return;
            }
            if (e.target.closest("[data-sentence-learn]")) {
              const learned = toggleSentenceLearned(id);
              card.classList.toggle("is-learned", learned);
              const btn = e.target.closest("[data-sentence-learn]");
              btn.innerHTML = icon("check") + (learned ? "取消已背" : "标记已背");
              let flag = card.querySelector(".learned-flag");
              if (learned && !flag) {
                flag = document.createElement("span");
                flag.className = "learned-flag";
                flag.innerHTML = icon("check") + "已背";
                card.querySelector(".sentence-foot").appendChild(flag);
              } else if (!learned && flag) flag.remove();
              toast(learned ? "标记已背，明天再复习一次" : "已取消");
              return;
            }
            if (e.target.closest("[data-sentence-copy]")) {
              const en = card.querySelector(".sentence-en").textContent;
              const zh = card.querySelector(".sentence-zh").textContent;
              copyText(en + "\n" + zh);
              return;
            }
            if (e.target.closest("[data-sentence-speak]")) {
              speak(card.querySelector(".sentence-en").textContent);
              return;
            }
            if (e.target.closest("[data-sentence-variants]")) {
              const panel = card.querySelector(".sentence-variants");
              const btn = e.target.closest("[data-sentence-variants]");
              panel.hidden = !panel.hidden;
              btn.innerHTML = icon("shuffle") + (panel.hidden ? "替换句 " + (s.variants || []).length : "收起替换");
              return;
            }
            if (e.target.closest("[data-variant-use]")) {
              const idx = Number(e.target.closest("[data-variant-use]").getAttribute("data-variant-use"));
              const v = (s.variants || [])[idx];
              if (!v) return;
              const enEl = card.querySelector(".sentence-en");
              const zhEl = card.querySelector(".sentence-zh");
              if (card.getAttribute("data-swapped") === String(idx)) {
                enEl.innerHTML = slotify(s.en); zhEl.textContent = s.zh;
                card.removeAttribute("data-swapped");
                e.target.closest("[data-variant-use]").textContent = "用这句";
                toast("已恢复原句");
              } else {
                enEl.innerHTML = slotify(v.en); zhEl.textContent = v.zh;
                card.setAttribute("data-swapped", String(idx));
                $$("[data-variant-use]", card).forEach(function (b) { b.textContent = "用这句"; });
                e.target.closest("[data-variant-use]").textContent = "已换";
                toast("已换成替换句，点“复制”可直接用");
              }
              return;
            }
          });
        }

        $$("[data-open-sentence-flashcards]").forEach(function (btn) {
          btn.addEventListener("click", function () { openSentenceFlashcards(currentList(), "背这组功能句"); });
        });
        $$("[data-random-sentence]").forEach(function (btn) {
          btn.addEventListener("click", function () { openSentenceFlashcards([randomSentence()], "随机背一句"); });
        });
        if (search) {
          document.addEventListener("keydown", function focusSearch(e) {
            if (e.key === "/" && document.activeElement && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) {
              e.preventDefault();
              if (document.body.contains(search)) search.focus();
              else document.removeEventListener("keydown", focusSearch);
            }
          });
        }
      }
    };
  };

  function paragraphLabel(part, index, total, en) {
    if (part === "part-a") {
      if (index === 0 && /^Dear/i.test(en.trim())) return "称呼";
      if (index === 0 && /^(Notice|Volunteers Wanted|Minutes)/i.test(en.trim())) return "标题";
      if (index === total - 1 && /^(Yours|Sincerely|Student Union|The English Club|Li Ming)/i.test(en.trim())) {
        return /^(Student Union|The English Club|Li Ming)/i.test(en.trim()) ? "发布" : "落款";
      }
      if (index === total - 1 && /^(Recorded by|Recorder)/i.test(en.trim())) return "记录";
      if (/^Time:/i.test(en.trim())) return "时间地点";
      if (/^Topic:/i.test(en.trim())) return "议题";
      if (/discussed|decided|agreed/i.test(en)) return "讨论与决定";
      // 书信第一段是称呼、通知第一段是标题；正文段号正好等于数组下标
      return "P" + index;
    }
    return "P" + (index + 1);
  }

  function essayCardHtml(e, part) {
    const learned = isEssayLearned(e.id);
    const isPrediction = (e.tags || []).indexOf("2027预测") !== -1;

  pages.essays = function (param) {
    if (param) return essayDetailPage(param);
    const all = allEssays();
    const filters = { part: "all", q: "", favOnly: false };

    function filtered() {
      return all.filter(function (e) {
        const isA = (K.partAEssays || []).indexOf(e) !== -1;
        if (filters.part === "a" && !isA) return false;
        if (filters.part === "b" && isA) return false;
        if (filters.favOnly && !isFavorite(e.id)) return false;
        if (filters.q) {
          const q = filters.q.toLowerCase();
          const hay = [e.title, e.type, e.prompt, (e.tags || []).join(" "), (e.paragraphs || []).map(function (p) { return p.en + " " + p.zh; }).join(" ")].join(" ").toLowerCase();
          if (hay.indexOf(q) === -1) return false;
        }
        return true;
      });
    }

    function gridHtml() {
      const list = filtered();
      if (!list.length) return emptyState("没有匹配的范文", "换个关键词，或者切回“全部”。", "#/essays", "查看全部");

      const b = list.filter(function (e) { return (K.partBEssays || []).indexOf(e) !== -1; });

        if (!arr.length) return "";

    function refresh() {

        '<button class="btn btn-secondary" type="button" data-print-page>' + icon("print") + '打印学习</button><a class="btn btn-primary" href="#/templates">' + icon("layout") + '去模板工坊</a>') + body,

            refresh();
          });

        if (search) search.addEventListener("input", debounce(function () { filters.q = search.value.trim(); refresh(); }, 120));
        $$("[data-essay-fav-filter]").forEach(function (btn) {
          btn.addEventListener("click", function () {

  function predictionEssays() {

      return tags.some(function (t) { return /2027|预测/.test(t); }) || /^(a1[1-9]|a20|b1[1-9]|b20)$/.test(e.id);
    });
  }

              '<div class="practice-checklist-grid">' + checklist + '</div>' +
            '</section>' +
          '</div>' +
        '</div>',

      after: function () {
        const textarea = $("#practice-text");
        const countEl = $("#practice-count");
        const note = $("#practice-save-note");
        const select = $("#practice-select");
        let timerId = null;
        let remaining = target.minutes * 60;
        let running = false;
        let currentChecks = checks.slice();

        function countWords(value) {
          return value.trim().split(/\s+/).filter(function (t) { return /[A-Za-z0-9]/.test(t); }).length;
        }
        function paintCount() {
          if (!textarea || !countEl) return;
          const n = countWords(textarea.value);
          let cls = "word-count";
          let extra = "";
          if (n > 0 && n < target.min) { cls += " is-low"; extra = " · 还差 " + (target.min - n); }
          else if (n > target.max) { cls += " is-high"; extra = " · 超出 " + (n - target.max); }
          else if (n >= target.min && n <= target.max) { cls += " is-ok"; extra = " · 字数达标"; }
          countEl.className = cls;
          countEl.textContent = n + " 词" + extra + " / " + target.min + "–" + target.max;
        }
        function saveDraft(showToast) {
          if (!textarea) return;
          currentChecks = $$("[data-practice-check]").map(function (input) { return input.checked; });
          try {
            localStorage.setItem(draftKey, JSON.stringify({ text: textarea.value, checks: currentChecks, updated: Date.now() }));
            if (note) note.textContent = "已保存到本机 · " + new Date().toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" });
          } catch (e) { /* ignore */ }
          if (showToast) { recordActivity(3); toast("草稿已保存"); }
        }
        const saveLater = debounce(function () { saveDraft(false); }, 700);

        if (textarea) {
          textarea.addEventListener("input", function () { paintCount(); saveLater(); });
          paintCount();
        }
        if (select) {
          select.addEventListener("change", function () {
            saveDraft(false);
            location.hash = "#/practice/" + select.value;
          });
        }
        $$("[data-practice-save]").forEach(function (btn) { btn.addEventListener("click", function () { saveDraft(true); }); });
        $$("[data-practice-copy]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            if (!textarea || !textarea.value.trim()) { toast("先写几句再复制"); return; }
            copyText(textarea.value, "你的作文已复制");
          });
        });
        $$("[data-practice-clear]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            if (!textarea) return;
            if (!window.confirm("确定清空这道题的所有草稿吗？")) return;
            textarea.value = "";
            try { localStorage.removeItem(draftKey); } catch (e) { /* ignore */ }
            $$("[data-practice-check]").forEach(function (input) { input.checked = false; });
            paintCount(); paintCheck(); saveDraft(false); textarea.focus(); toast("已清空");
          });
        });

        function formatClock(sec) {
          const m = Math.floor(sec / 60);
          const s = sec % 60;
          return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
        }
        function paintClock() {
          const clock = $("#practice-clock");
          if (clock) clock.textContent = formatClock(Math.max(0, remaining));
        }
        function stopTimer() {
          running = false;
          if (timerId) { clearInterval(timerId); timerId = null; }
          $$("[data-timer-toggle]").forEach(function (b) { b.innerHTML = icon("play") + "继续计时"; });
        }
        function startTimer() {
          if (running) { stopTimer(); return; }
          if (remaining <= 0) remaining = target.minutes * 60;
          running = true;
          $$("[data-timer-toggle]").forEach(function (b) { b.innerHTML = icon("clock") + "暂停"; });
          timerId = setInterval(function () {
            remaining--;
            paintClock();
            if (remaining <= 0) {
              stopTimer();
              toast("时间到。先停笔，按清单自查。");
            }
          }, 1000);
        }
        $$("[data-timer-toggle]").forEach(function (btn) { btn.addEventListener("click", startTimer); });
        $$("[data-timer-reset]").forEach(function (btn) {
          btn.addEventListener("click", function () { stopTimer(); remaining = target.minutes * 60; paintClock(); toast("计时已重置"); });
        });
        paintClock();

        function paintCheck() {
          const el = $("#practice-check-count");
          if (!el) return;
          const done = $$("[data-practice-check]").filter(function (i) { return i.checked; }).length;
          const total = (meta.checklist || []).length;
          el.textContent = done + "/" + total;
          el.className = "badge " + (done === total ? "badge-green" : "badge-amber");
        }
        $$("[data-practice-check]").forEach(function (input) {
          input.addEventListener("change", function () { paintCheck(); saveDraft(false); });
        });
        paintCheck();

        pageCleanup = function () {
          if (timerId) clearInterval(timerId);
          timerId = null;
          saveDraft(false);
        };
      }
    };
  };

  let quizSession = null;

  const QUIZ_MODES = [
    { key: "daily", label: "今日 5 题", desc: "每天固定一组小题，先完成今天的挑战。", icon: "spark", special: "daily" },
    { key: "tense", label: "时态专项", desc: "一般现在、过去、完成、将来、进行时，一次分清。", icon: "clock", types: ["时态"] },
    { key: "clause", label: "从句专项", desc: "定语、宾语、主语、表语、同位语、状语从句。", icon: "grammar", types: ["从句"] },
    { key: "writing", label: "写作基础", desc: "被动、there be、主谓一致、冠词和固定搭配。", icon: "check", types: ["写作三大件", "写作基础"] },
    { key: "pattern", label: "句型专项", desc: "倒装、强调、非谓语、比较和 it 句型。", icon: "quote", types: ["句型填空", "句型"] },

    { key: "logic", label: "作文逻辑", desc: "看上下文选最连贯的下一句，练段落衔接。", icon: "layout", types: ["作文逻辑"] },
    { key: "wrong", label: "错题本", desc: "只刷做错过的题；连续答对两次自动移出。", icon: "bookmark", special: "wrong" },
    { key: "mixed", label: "混合挑战", desc: "全部题目混在一起，适合考前查漏。", icon: "target", special: "all" }
  ];

  function quizModeMeta(key) {
    return QUIZ_MODES.find(function (m) { return m.key === key; }) || QUIZ_MODES[0];
  }

  function quizItemsFor(modeKey) {
    const mode = quizModeMeta(modeKey);
    if (mode.special === "daily") return dailyQuestions();
    if (mode.special === "wrong") return wrongQuestions();
    if (mode.special === "all") return allQuestions();
    return allQuestions().filter(function (q) { return (mode.types || []).indexOf(q.type) !== -1; });
  }

  function quizModeCard(m) {
    const best = state.quizBest[m.key];
    const count = quizItemsFor(m.key).length;
    const disabled = count === 0;
    return '<button class="quiz-mode-card' + (m.key === "wrong" ? " is-wrong" : "") + '" type="button" data-quiz-start="' + m.key + '"' + (disabled ? " disabled" : "") + '>' +
      '<div class="quiz-mode-top"><span class="quiz-mode-icon">' + icon(m.icon) + '</span><h3>' + esc(m.label) + '</h3></div>' +
      '<p>' + esc(m.desc) + '</p>' +
      '<div class="meta"><span>' + count + ' 道题</span><span class="best">' + (best != null ? "最好 " + best + "%" : "还没做过") + '</span></div>' +
      '</button>';
  }

  function quizSetupHtml() {
    const stats = questionStats();
    const streak = getStreak(state.activeDates);
    const daily = todayDailyState();
    const dailyQ = dailyQuestions();
    const cardModes = QUIZ_MODES.filter(function (m) { return m.key !== "daily"; });
    return '<div class="drill-dashboard">' +
        '<div class="drill-stat"><span>连续学习</span><strong>' + streak + '<small>天</small></strong></div>' +

        '<div class="drill-stat"><span>掌握题目</span><strong>' + stats.mastered + '<small>/ ' + stats.total + '</small></strong></div>' +

          (daily ? "今天已完成：" + daily.correct + " / " + daily.total + " 正确。可以再来一轮。" : "每天 5 道小题，先拿今天的连续学习天数。") +

      '<div class="quiz-setup-grid">' + cardModes.map(quizModeCard).join("") + '</div>' +
      '<div class="drill-history panel"><div class="drill-history-head"><div><h3>最近 12 周打卡</h3><p>每个格子代表一天，颜色越深，学习动作越多。</p></div><a class="section-link" href="#/stats">完整学习数据' + icon("arrow-right") + '</a></div>' +
        heatmapHtml(12, true) + '</div>' +
      '<div class="callout tip mt-3">' + icon("bulb") + '<div><strong>怎么用：</strong>先完成今日 5 题；然后从最弱的专项开始刷。错题会进入错题本，连续答对两次才移出。答错不可怕，怕的是不回头看解释。</div></div>';
  }

  function quizQuestionHtml() {
    const s = quizSession;
    if (!s) return "";
    if (s.finished) return quizResultHtml();
    const q = s.items[s.index];
    const selected = s.answers[s.index];
    const answered = selected != null;
    const pct = Math.round((s.index) / s.items.length * 100);
    const options = (q.options || []).map(function (opt, i) {
      let cls = "quiz-option";
      if (answered) {
        if (i === q.answer) cls += " correct";
        else if (i === selected) cls += " wrong";
      }
      return '<button class="' + cls + '" type="button" data-quiz-option="' + i + '"' + (answered ? " disabled" : "") + '>' +
        '<span class="key">' + "ABCD"[i] + '</span><span>' + esc(opt) + '</span></button>';
    }).join("");
    const feedback = answered
      ? '<div class="quiz-feedback ' + (selected === q.answer ? "" : "wrong") + '">' +
          '<b>' + (selected === q.answer ? "答对了。" : "正确答案是 " + "ABCD"[q.answer] + "。") + '</b> ' + esc(q.explanation) +
          (selected === q.answer ? "" : '<br><span class="feedback-sub">已收进错题本，连续答对两次会自动移出。</span>') + '</div>'
      : "";
    const last = s.index === s.items.length - 1;
    const score = s.answers.reduce(function (acc, a, i) { return acc + (a === s.items[i].answer ? 1 : 0); }, 0);

    return '<div class="quiz-shell">' +
      '<div class="quiz-top"><button class="btn btn-ghost btn-sm" type="button" data-quiz-exit>' + icon("arrow-left") + '退出</button><span class="tag">' + esc(s.label) + '</span>' +
        '<span class="quiz-streak">' + icon("spark") + '连对 ' + (s.streak || 0) + '</span>' +
        '<span class="quiz-progress-text">' + (s.index + 1) + ' / ' + s.items.length + ' · 已对 ' + score + '</span></div>' +
      '<div class="quiz-progress"><span style="width:' + Math.max(4, pct) + '%"></span></div>' +
      '<div class="panel panel-pad quiz-question-card">' +
        '<div class="quiz-question-label">第 ' + (s.index + 1) + ' 题' + (q.type ? ' · ' + esc(q.type) : '') + (q.level ? ' · ' + esc(q.level) : '') + '</div>' +
        '<h2 class="quiz-question">' + esc(q.question || q.prompt || "") + '</h2>' +
        '<div class="quiz-options">' + options + '</div>' +
        feedback +
        '<div class="quiz-nav"><span class="small muted">' + (answered ? "看完解释再继续 · 快捷键 Enter" : "选一个答案 · 快捷键 A/B/C/D 或 1–4") + '</span>' +
          (answered ? '<button class="btn btn-primary" type="button" data-quiz-next>' + (last ? "看结果" : "下一题") + icon("arrow-right") + '</button>' : "") +
        '</div>' +
      '</div>' +
    '</div>';
  }

  function quizResultHtml() {
    const s = quizSession;
    const total = s.items.length;
    const correct = s.answers.reduce(function (acc, a, i) { return acc + (a === s.items[i].answer ? 1 : 0); }, 0);
    const pct = Math.round(correct / total * 100);
    const prevBest = state.quizBest[s.mode] || 0;
    const best = Math.max(prevBest, pct);
    if (!s.saved) {
      state.quizBest[s.mode] = best;
      saveState();
      s.saved = true;
    }
    if (s.isDaily && !s.dailySaved) {
      markDailyDone(correct, total);
      s.dailySaved = true;
    }
    const title = pct >= 90 ? "基本稳了，继续保持" : pct >= 70 ? "不错，再把错题过一遍" : pct >= 50 ? "有漏洞，回语法卡补一下" : "先别刷题，回去背卡";
    const wrong = s.items.map(function (q, i) {
      return { q: q, a: s.answers[i] };
    }).filter(function (x) { return x.a !== x.q.answer; });
    const review = wrong.length
      ? '<div class="quiz-review"><h3>错题复盘</h3>' + wrong.map(function (x) {
          return '<div class="review-item"><p class="q">' + esc(x.q.question || x.q.prompt) + '</p>' +
            '<p class="a">正确答案：' + "ABCD"[x.q.answer] + '. ' + esc((x.q.options || [])[x.q.answer]) + ' <span>你的答案：' + (x.a == null ? "未答" : "ABCD"[x.a] + ". " + esc((x.q.options || [])[x.a])) + '</span></p>' +
            '<p class="exp">' + esc(x.q.explanation) + '</p></div>';
        }).join("") + '</div>'
      : '<div class="callout tip mt-3" style="text-align:left">' + icon("spark") + '<div><strong>全对。</strong>下一轮可以换“混合挑战”，或者去写一篇完整作文。</div></div>';

    return '<div class="quiz-shell"><div class="panel panel-pad quiz-result">' +
      '<div class="score-ring" style="--p:' + pct + '"><div><strong>' + pct + '</strong><span>分 / 100</span></div></div>' +
      '<h2>' + esc(title) + '</h2>' +
      '<p>' + correct + ' / ' + total + ' 题正确 · 历史最好 ' + best + '% · 最高连对 ' + (s.maxStreak || 0) + '</p>' +
      (s.isDaily ? '<p class="daily-done-note">' + icon("check") + '今日挑战已打卡，格子已经点亮</p>' : "") +
      '<div class="hero-actions" style="justify-content:center"><button class="btn btn-primary" type="button" data-quiz-again="' + esc(s.mode) + '">' + icon("shuffle") + '再来一轮</button>' +
      '<button class="btn btn-secondary" type="button" data-quiz-exit>换一组题</button>' +
      '<a class="btn btn-secondary" href="#/stats">' + icon("target") + '看学习数据</a></div>' +
      review +
      '</div></div>';
  }

  function paintQuiz() {
    const area = $("#quiz-area");
    if (!area) return;
    if (!quizSession) area.innerHTML = quizSetupHtml();
    else area.innerHTML = quizQuestionHtml();
    bindQuiz();
  }

  function startQuiz(modeKey) {
    const mode = quizModeMeta(modeKey);
    const items = quizItemsFor(modeKey);
    if (!items.length) {
      if (modeKey === "wrong") toast("错题本是空的，先去做几道题吧");
      else toast("这个题库还没有内容");
      return;
    }
    quizSession = {
      mode: modeKey, label: mode.label, items: items, index: 0, answers: [],
      finished: false, saved: false, streak: 0, maxStreak: 0, isDaily: modeKey === "daily"
    };
    paintQuiz();
    const anchor = $("#quiz-area");
    if (anchor) anchor.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function chooseQuizOption(index) {
    if (!quizSession || quizSession.finished) return;
    if (quizSession.answers[quizSession.index] != null) return;
    const q = quizSession.items[quizSession.index];
    const selected = Number(index);
    if (selected < 0 || selected >= 4) return;
    quizSession.answers[quizSession.index] = selected;
    const correct = selected === q.answer;
    recordAnswer(q, correct);
    if (correct) {
      quizSession.streak = (quizSession.streak || 0) + 1;
      quizSession.maxStreak = Math.max(quizSession.maxStreak || 0, quizSession.streak);
    } else {
      quizSession.streak = 0;
    }
    paintQuiz();
  }

  function nextQuizQuestion() {
    if (!quizSession) return;
    if (quizSession.answers[quizSession.index] == null) return;
    if (quizSession.index >= quizSession.items.length - 1) quizSession.finished = true;
    else quizSession.index += 1;
    paintQuiz();
  }

  function bindQuiz() {
    $$("[data-quiz-start]").forEach(function (btn) {
      btn.addEventListener("click", function () { startQuiz(btn.getAttribute("data-quiz-start")); });
    });
    $$("[data-quiz-option]").forEach(function (btn) {
      btn.addEventListener("click", function () { chooseQuizOption(btn.getAttribute("data-quiz-option")); });
    });
    $$("[data-quiz-next]").forEach(function (btn) {
      btn.addEventListener("click", nextQuizQuestion);
    });
    $$("[data-quiz-exit]").forEach(function (btn) {
      btn.addEventListener("click", function () { quizSession = null; paintQuiz(); });
    });
    $$("[data-quiz-again]").forEach(function (btn) {
      btn.addEventListener("click", function () { startQuiz(btn.getAttribute("data-quiz-again")); });
    });
  }

  pages.quiz = function (param) {
    return {
      html:
        pageHead("刷题训练", "每天 10 分钟，把语法变成手感", "所有题目都围绕英语二作文：时态、从句、写作基础、句型、翻译挑错和作文逻辑。答错自动进错题本，连续答对两次才移出。",
          '<a class="btn btn-secondary" href="#/stats">' + icon("target") + '学习数据</a><a class="btn btn-primary" href="#/quiz/daily">' + icon("play") + '今日挑战</a>') +
        '<div id="quiz-area"></div>',
      after: function () {
        if (param && QUIZ_MODES.some(function (m) { return m.key === param; })) {
          if (!quizSession || quizSession.mode !== param) startQuiz(param);
          else paintQuiz();
        } else {
          paintQuiz();
        }
      }
    };
  };

  /* ============================================================
     学习数据 / 打卡
     ============================================================ */

      { label: "连续学习", value: streak, unit: "天", icon: "target", tone: "green" },
      { label: "累计学习动作", value: acts, unit: "次", icon: "spark", tone: "amber" },
      { label: "已背功能句", value: state.learnedSentences.length, unit: "/ 60", icon: "quote", tone: "blue" },

      : '<div class="empty-inline">' + icon("spark") + '错题本是空的。去做几道题，错题会自动收进来。</div>';

    return {
      html:
        pageHead("学习数据", "把每天的努力，变成看得见的格子", "类似 GitHub 的 contribution graph：每完成一次学习动作，今天的格子就会变深。记录只存在本机，不上传。",
          '<a class="btn btn-secondary" href="#/plan">' + icon("map") + '回到计划</a><a class="btn btn-primary" href="#/quiz/daily">' + icon("play") + '做今日 5 题</a>') +
        '<div class="stats-overview">' + cards + '</div>' +
        '<section class="panel heatmap-card">' +
          '<div class="drill-history-head"><div><h2>学习热力图</h2><p>最近 18 周 · ' + (daily ? "今天已完成今日挑战" : "今天还没有完成挑战") + '</p></div><span class="badge badge-green">' + acts + ' 次动作</span></div>' +
          heatmapHtml(18, false) +
          '<div class="heatmap-tip">格子颜色越深，当天学习动作越多；空白格只是那天没记录，不代表失败。</div>' +
        '</section>' +
        '<div class="stats-two-col">' +
          '<section class="panel skill-card"><div class="drill-history-head"><div><h2>技能掌握</h2><p>每个专项答对 2 次算“掌握”</p></div><span class="badge badge-amber">' + stats.mastered + ' / ' + stats.total + '</span></div><div class="skill-list">' + skills + '</div></section>' +
          '<section class="panel achievement-card"><div class="drill-history-head"><div><h2>成就</h2><p>已解锁 ' + unlocked + ' / ' + badges.length + ' 个</p></div><span class="badge '+ (unlocked === badges.length ? "badge-green" : "badge-muted") + '">' + (unlocked === badges.length ? "全部完成" : "继续") + '</span></div><div class="achievement-grid">' + badgeHtml + '</div></section>' +
        '</div>' +
        '<section class="panel wrong-preview-card"><div class="drill-history-head"><div><h2>错题本</h2><p>' + stats.wrong + ' 道题等待复习 · 连续答对两次自动移出</p></div><a class="btn btn-secondary btn-sm" href="#/quiz/wrong">' + icon("bookmark") + '去刷错题</a></div>' + wrongHtml + '</section>' +
        '<div class="callout tip mt-3">' + icon("bulb") + '<div><strong>目标不是全绿，是不断。</strong>每天 10 分钟刷 5 题，比周末一次刷 100 题更有效。热力图空白一天没关系，第二天回来就行。</div></div>',
      after: function () {}
    };
  };

  /* ============================================================
     怎么用 / 来源
     ============================================================ */

  pages.about = function () {
    const sources = (meta.sources || []).map(function (s) {
      return '<a class="source-row" href="' + esc(s.url) + '" target="_blank" rel="noopener noreferrer">' + icon("external") +
        '<div><strong>' + esc(s.name) + '</strong><span>' + esc(s.note) + '</span></div></a>';
    }).join("");
    const faq = (meta.faq || []).map(function (f) {
      return '<details class="faq-item"><summary>' + esc(f.q) + '</summary><div class="answer">' + esc(f.a) + '</div></details>';
    }).join("");
    const notices = (meta.notices || []).map(function (n) { return "<li>" + esc(n) + "</li>"; }).join("");

    return {
      html:
        pageHead("怎么用 / 来源", "这是一个“能马上开始”的作文工具", "不是一套需要从头学到尾的课程，而是一个按考试动作拆好的训练场：看一张卡、背两句、套一段、写一篇。",
          '<a class="btn btn-primary" href="#/plan">' + icon("map") + '从学习路线开始</a>') +
        '<div class="about-grid">' +
          '<div class="prose-card panel">' +
            '<h2>建议的使用顺序</h2>' +
            '<ol style="margin:0 0 12px;padding-left:20px;color:var(--ink-2);font-size:12.5px;line-height:1.9">' +
              '<li><b>先做一次刷题训练</b>（10 分钟），知道自己时态/从句哪块最弱。</li>' +
              '<li><b>看 4 张时态卡 + 3 张从句卡</b>，每张只记公式和一个例句。</li>' +
              '<li><b>从句库挑 20 句</b>：开头 5、数据 4、原因 4、建议 4、结尾 3。每句遮中文说英文。</li>' +
              '<li><b>背 4 类小作文骨架 + 1 个大作文三段式</b>，先求格式对、要点全。</li>' +
              '<li><b>精读 5 篇范文</b>，抄写重点句，再限时写 1 小 + 1 大。</li>' +
              '<li><b>用检查清单自批</b>，把错句抄进自己的错题本。</li>' +
            '</ol>' +
            '<h3>为什么这样排？</h3>' +
            '<p>基础差的同学最容易犯的错，是先买一本语法书从第一页看，看到虚拟语气就放弃。考试作文不需要你掌握全部语法，它只需要你：格式对、要点全、句子基本正确、有一两个亮点句。所以本站把内容压到“最小可用集合”，先让你写出第一篇，再逐步加难度。</p>' +
            '<h3>一天到底怎么练？</h3>' +
            '<p>推荐 45 分钟标准版：5 分钟复习昨天两句 → 10 分钟看一张语法卡并造两句 → 10 分钟背两个功能句 → 15 分钟仿写一段 → 5 分钟检查主谓、时态、拼写。时间少就用 30 分钟保底版，别断。</p>' +
            '<h3>常见问题</h3>' +
            '<div class="faq-list">' + faq + '</div>' +
            '<h3>内容说明</h3>' +
            '<p>站内语法讲解、功能句、模板骨架和 40 篇范文均为面向本工具的原创整理与示例；其中 PDF 冲刺句和预测题眼根据你提供的资料改写，不整篇复制原文。通用句型属于英语公共表达，但未复制任何机构的付费讲义、课程文案或范文。若你发现表达有误，应以权威词典、语法书和当年官方大纲为准。</p>' +
            '<p class="small muted">版本 ' + esc(meta.version) + ' · 更新于 ' + esc(meta.updated) + '。如果考试大纲调整，请先以教育部教育考试院发布的最新大纲为准。</p>' +
          '</div>' +
          '<aside class="about-side">' +

            '<section class="panel panel-pad"><h2 style="margin:0 0 8px;font-family:var(--serif);font-size:20px">使用须知</h2><ul class="notice-list">' + notices + '</ul></section>' +

              '<li>学习进度保存在本机浏览器，不会上传；换浏览器或清缓存会丢。</li>' +
            '</ul></section>' +
          '</aside>' +
        '</div>',
      after: function () {}
    };
  };

  /* ---------------- 启动 ---------------- */

  function init() {
    if (!location.hash) location.hash = "#/home";
    const skipLink = $(".skip-link");
    if (skipLink) skipLink.addEventListener("click", function (e) {
      e.preventDefault();
      const view = $("#view");
      if (view) { view.focus(); view.scrollIntoView({ behavior: "smooth" }); }
    });
    const menuBtn = $("#menu-btn");
    const closeBtn = $("#sidebar-close");
    const scrim = $("#sidebar-scrim");
    if (menuBtn) menuBtn.addEventListener("click", openSidebar);
    if (closeBtn) closeBtn.addEventListener("click", closeSidebar);
    if (scrim) scrim.addEventListener("click", closeSidebar);
    $$(".sidebar .nav-item, .bottom-nav a").forEach(function (a) { a.addEventListener("click", closeSidebar); });

    const randomBtn = $("#random-sentence-btn");
    if (randomBtn) randomBtn.addEventListener("click", function () {
      const s = randomSentence();
      if (s) openSentenceFlashcards([s], "随机背一句");
    });

    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") { closeModal(); closeSidebar(); }
      if (currentRoute !== "quiz" || !quizSession || quizSession.finished) return;
      if ($(".modal") || /INPUT|TEXTAREA|SELECT/.test((document.activeElement && document.activeElement.tagName) || "")) return;
      const key = String(e.key || "").toUpperCase();
      let optionIndex = -1;
      if (/^[1-4]$/.test(key)) optionIndex = Number(key) - 1;
      if (/^[A-D]$/.test(key)) optionIndex = key.charCodeAt(0) - 65;
      if (optionIndex >= 0) {
        e.preventDefault();
        chooseQuizOption(optionIndex);
      } else if (e.key === "Enter" && quizSession.answers[quizSession.index] != null) {
        e.preventDefault();
        nextQuizQuestion();
      }
    });

    const version = $("#site-version");
    if (version) version.textContent = meta.version || "1.0";

    window.addEventListener("hashchange", renderRoute);
    renderRoute();
  }

  // 暴露给页面渲染函数使用
  window.KY_UI = {
    K: K, meta: meta, $: $, $$: $$, esc: esc, icon: icon, slotify: slotify, plain: plain,
    debounce: debounce, todayKey: todayKey, dateLabel: dateLabel, daysUntil: daysUntil,
    state: function () { return state; }, saveState: saveState, toast: toast, copyText: copyText,
    openModal: openModal, closeModal: closeModal, isFavorite: isFavorite, toggleFavorite: toggleFavorite,
    isSentenceLearned: isSentenceLearned, toggleSentenceLearned: toggleSentenceLearned,
    isEssayLearned: isEssayLearned, toggleEssayLearned: toggleEssayLearned,
    todayTasks: todayTasks, setTask: setTask, todayDoneCount: todayDoneCount,
    refreshShell: refreshShell, levelBadge: levelBadge, sectionHead: sectionHead, emptyState: emptyState,
    getSentence: getSentence, randomSentence: randomSentence, sentenceForToday: sentenceForToday,
    findEssay: findEssay, allEssays: allEssays, wordCountFromParagraphs: wordCountFromParagraphs,
    renderChart: renderChart, CHART_COLORS: CHART_COLORS, getStreak: getStreak,
    openFlashcards: openFlashcards, openGrammarFlashcards: openGrammarFlashcards,
    openSentenceFlashcards: openSentenceFlashcards, speak: speak, pages: pages, renderRoute: renderRoute
  };

  document.addEventListener("DOMContentLoaded", init);
})();

</script>
