  gap: 8px;
  align-items: stretch;
}
.transform-card {
  padding: 14px 15px;
  border: 1px solid var(--line);
  border-radius: 11px;
  background: var(--paper-2);
}
.transform-card.basic { opacity: .82; }
.transform-card.advanced { border-color: #bfd6c9; background: var(--mint-2); }
.transform-card span { display: block; margin-bottom: 5px; color: var(--muted); font-size: 9px; font-weight: 600; letter-spacing: .08em; }
.transform-card p { margin: 0; font-size: 13px; line-height: 1.6; }
.transform-arrow { display: grid; place-items: center; color: var(--green-2); }
.transform-arrow .icon { width: 19px; height: 19px; }
.transform-note { margin: 8px 0 0; color: var(--muted); font-size: 11px; }

.extras-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.vocab-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 13px; }
.vocab-card { padding: 19px 19px 15px; }
.vocab-card h3 { margin: 0 0 10px; font-family: var(--serif); font-size: 19px; }
.vocab-card h3 span { color: var(--muted-2); font-family: var(--sans); font-size: 9px; font-weight: 400; }
.vocab-list { display: flex; flex-direction: column; }
.vocab-item { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, .8fr); gap: 8px; padding: 7px 0; border-top: 1px dashed var(--line); font-size: 10.5px; line-height: 1.5; }
.vocab-item:first-child { border-top: 0; }
.vocab-item .en { color: var(--ink-2); font-family: var(--serif); font-size: 12.5px; }
.vocab-item .zh { color: var(--muted); text-align: right; }
.extra-card { padding: 21px; }
.extra-card h3 { margin: 0 0 2px; font-family: var(--serif); font-size: 21px; }
.extra-card .en { color: var(--muted); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; }
.extra-formula {
  margin: 14px 0;
  padding: 10px 12px;
  border-radius: 8px;
  color: var(--green);
  background: var(--mint-2);
  font-family: var(--mono);
  font-size: 12px;
  line-height: 1.6;
}
.extra-card p { margin: 0 0 9px; font-size: 12px; line-height: 1.7; }
.extra-card .example { color: var(--ink-2); font-family: var(--serif); font-size: 14.5px; }
.extra-card .example-zh { color: var(--muted); font-size: 11.5px; }

/* ---------------- Sentence bank ---------------- */

.sentence-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}
.sentence-card {
  display: flex;
  flex-direction: column;
  padding: 19px 20px 15px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--paper);
  box-shadow: var(--shadow-sm);
  transition: border-color .16s, box-shadow .16s;
}
.sentence-card:hover { border-color: var(--line-strong); box-shadow: var(--shadow-md); }
.sentence-card.is-learned { border-color: #c2d8cb; background: linear-gradient(180deg, #fbfdfb, var(--paper)); }
.sentence-top { display: flex; align-items: center; gap: 7px; margin-bottom: 11px; }
.sentence-top .cat {
  color: var(--coral);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .03em;
}
.sentence-top .scene { margin-left: auto; color: var(--muted-2); font-size: 9.5px; }
.sentence-fav {
  display: grid;
  place-items: center;
  width: 28px;
  height: 28px;
  margin: -5px -6px -5px 0;
  border: 0;
  border-radius: 7px;
  color: var(--muted-2);
  background: transparent;
}
.sentence-fav:hover { color: var(--amber-2); background: var(--amber-soft); }
.sentence-fav .icon { width: 16px; height: 16px; }
.sentence-fav.active { color: var(--amber-2); }
.sentence-fav.active .icon { fill: var(--amber); }
.sentence-en {
  margin: 0 0 7px;
  font-family: var(--serif);
  font-size: 18px;
  line-height: 1.55;
  letter-spacing: -.005em;
  word-break: break-word;
}
.sentence-en .slot {
  padding: 0 2px;
  border-radius: 4px;
  color: #8a5a11;
  background: var(--amber-soft);
  font-family: var(--sans);
  font-size: .86em;
}
.sentence-zh { margin: 0 0 11px; color: var(--muted); font-size: 12.5px; line-height: 1.7; }
.sentence-note {
  margin: 0 0 12px;
  padding: 8px 10px;
  border-radius: 7px;
  color: var(--muted);
  background: var(--paper-2);
  font-size: 10.5px;
  line-height: 1.65;
}
.sentence-note b { color: var(--ink-2); }
.sentence-variants {
  margin: 0 0 12px;
  padding: 10px 12px;
  border: 1px dashed var(--line-strong);
  border-radius: 9px;
  background: var(--paper-2);
}
.sentence-variants .var-label {
  display: flex;
  align-items: center;
  gap: 5px;
  margin-bottom: 7px;
  color: var(--muted);
  font-size: 9.5px;
  font-weight: 600;
  letter-spacing: .06em;
}
.sentence-variants .var-label .icon { width: 13px; height: 13px; }
.variant-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 8px;
  padding: 6px 0;
  border-top: 1px dashed var(--line);
}
.variant-row:first-of-type { border-top: 0; }
.variant-row p { margin: 0; font-size: 12.5px; line-height: 1.55; }
.variant-row p span { display: block; margin-top: 2px; color: var(--muted); font-size: 10.5px; }
.variant-use {
  align-self: center;
  padding: 4px 8px;
  border: 1px solid var(--line);
  border-radius: 6px;
  color: var(--green-2);
  background: #fff;
  font-size: 9.5px;
  white-space: nowrap;
}
.variant-use:hover { border-color: var(--green-3); }
.sentence-foot {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: auto;
  padding-top: 11px;
  border-top: 1px solid var(--line);
}
.sentence-foot .mini-btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 7px;
  border: 0;
  border-radius: 5px;
  color: var(--muted);
  background: transparent;
  font-size: 10px;
}
.sentence-foot .mini-btn:hover { color: var(--ink); background: var(--paper-2); }
.sentence-foot .mini-btn .icon { width: 13px; height: 13px; }
.sentence-foot .learned-flag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  margin-left: auto;
  color: var(--green-2);
  font-size: 10px;
}
.sentence-foot .learned-flag .icon { width: 13px; height: 13px; }
.sentence-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 10px; }
.sentence-tags .tag { padding: 2px 6px; font-size: 9px; }

/* flashcards */

.flashcard-stage { padding: 8px 0 4px; }
.flashcard {
  position: relative;
  width: 100%;
  min-height: 280px;
  margin: 0 auto;
  perspective: 1200px;
  cursor: pointer;
}
.flashcard-inner {
  position: relative;
  width: 100%;
  min-height: 280px;
  transition: transform .55s cubic-bezier(.2, .8, .2, 1);
  transform-style: preserve-3d;
}
.flashcard.flipped .flashcard-inner { transform: rotateY(180deg); }
.flashcard-face {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 30px;
  border: 1px solid var(--line);
  border-radius: 17px;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
}
.flashcard-front { background: var(--paper); }
.flashcard-back {
  background: var(--green);
  color: #f6efde;
  transform: rotateY(180deg);
}
.flashcard-face .fc-label {
  position: absolute;
  top: 17px;
  left: 20px;
  color: var(--muted);
  font-size: 9.5px;
  font-weight: 600;
  letter-spacing: .12em;
  text-transform: uppercase;
}
.flashcard-back .fc-label { color: rgba(246, 239, 222, .45); }
.flashcard-front .fc-main {
  margin: 0;
  font-size: clamp(20px, 2.4vw, 28px);
  line-height: 1.5;
}
.flashcard-front .fc-sub { margin: 10px 0 0; color: var(--muted); font-size: 12px; }
.flashcard-back .fc-main {
  margin: 0;
  font-family: var(--serif);
  font-size: clamp(22px, 2.6vw, 30px);
  line-height: 1.45;
}
.flashcard-back .fc-sub { margin: 12px 0 0; color: rgba(246, 239, 222, .58); font-size: 12.5px; }
.flashcard-hint {
  position: absolute;
  bottom: 16px;
  left: 20px;
  color: var(--muted-2);
  font-size: 9.5px;
}
.flashcard-back .flashcard-hint { color: rgba(246, 239, 222, .36); }
.flashcard-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: 16px;
}
.flashcard-progress { color: var(--muted); font-family: var(--mono); font-size: 11px; }
.flashcard-buttons { display: flex; gap: 8px; }

/* ---------------- Templates ---------------- */

.template-list { display: flex; flex-direction: column; gap: 12px; }
.template-card {
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 15px;
  background: var(--paper);
  box-shadow: var(--shadow-sm);
  transition: border-color .16s, box-shadow .16s;
}
.template-card[open] { border-color: #c8bda6; box-shadow: var(--shadow-md); }
.template-card > summary {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 17px 20px;
  cursor: pointer;
  list-style: none;
  user-select: none;
}
.template-card > summary::-webkit-details-marker { display: none; }
.template-card > summary:hover { background: var(--paper-2); }
.template-no {
  display: grid;
  place-items: center;
  width: 34px;
  height: 34px;
  flex: 0 0 auto;
  border-radius: 9px;
  color: var(--green);
  background: var(--mint);
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 600;
}
.template-summary-copy { min-width: 0; }
.template-summary-copy h3 { margin: 0; font-family: var(--serif); font-size: 19px; }
.template-summary-copy p { margin: 2px 0 0; color: var(--muted); font-size: 11px; }
.template-summary-meta { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.template-chevron { color: var(--muted-2); transition: transform .2s; }
.template-chevron .icon { width: 18px; height: 18px; }
.template-card[open] .template-chevron { transform: rotate(180deg); }
.template-body { padding: 0 20px 22px; border-top: 1px solid var(--line); }
.template-body-grid {
  display: grid;
  grid-template-columns: minmax(0, .95fr) minmax(0, 1.05fr);
  gap: 22px;
  padding-top: 20px;
}
.template-left h4, .template-right h4 {
  display: flex;
  align-items: center;
  gap: 6px;
  margin: 0 0 10px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .06em;
}
.template-left h4 .icon, .template-right h4 .icon { width: 14px; height: 14px; color: var(--green-2); }
.structure-steps { display: flex; flex-direction: column; gap: 8px; }
.structure-step {
  display: grid;
  grid-template-columns: 43px minmax(0, 1fr);
  gap: 10px;
  padding: 10px 11px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: var(--paper-2);
}
.structure-step .step-label {
  color: var(--coral);
  font-family: var(--mono);
  font-size: 9px;
  font-weight: 600;
  line-height: 1.6;
  text-transform: uppercase;
}
.structure-step .step-en { margin: 0; font-family: var(--serif); font-size: 13.5px; line-height: 1.5; }
.structure-step .step-zh { margin: 3px 0 0; color: var(--muted); font-size: 10.5px; line-height: 1.6; }
.structure-step .step-tip { margin: 5px 0 0; color: var(--green-2); font-size: 9.5px; line-height: 1.5; }
.skeleton-shell {
  position: relative;
  padding: 18px 18px 16px;
  border: 1px solid var(--line);
  border-radius: 11px;
  background-color: #f8f2e4;
  background-image: linear-gradient(rgba(201, 189, 166, .18) 1px, transparent 1px);
  background-size: 100% 28px;
}
.skeleton-shell pre {
  margin: 0;
  color: var(--ink-2);
  font-family: var(--sans);
  font-size: 12.5px;
  line-height: 1.85;
  white-space: pre-wrap;
  word-break: break-word;
}
.skeleton-shell pre .slot {
  padding: 0 2px;
  border-radius: 3px;
  color: #8a5a11;
  background: rgba(240, 196, 91, .3);
  font-weight: 600;
}
.skeleton-actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.template-side-block { margin-top: 18px; }
.template-side-block h4 { margin-bottom: 8px; }
.slot-list { display: flex; flex-direction: column; gap: 5px; }
.slot-row { display: flex; gap: 8px; align-items: baseline; font-size: 11px; }
.slot-row code {
  padding: 1px 5px;
  border-radius: 4px;
  color: #8a5a11;
  background: var(--amber-soft);
  font-family: var(--mono);
  font-size: 10px;
  white-space: nowrap;
}
.slot-row span { color: var(--muted); }
.polish-list { display: flex; flex-direction: column; gap: 7px; }
.polish-row {
  display: grid;
  grid-template-columns: 1fr 16px 1fr;
  gap: 6px;
  align-items: center;
  padding: 8px 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--paper-2);
  font-size: 11px;
}
.polish-row .basic { color: var(--muted); text-decoration: line-through; text-decoration-color: #cda9a0; }
.polish-row .arrow { color: var(--green-2); text-align: center; }
.polish-row .advanced { color: var(--green); font-weight: 600; }
.pitfall-list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.pitfall-list li {
  position: relative;
  padding-left: 16px;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.6;
}
.pitfall-list li::before {
  content: "!";
  position: absolute;
  left: 0;
  top: 1px;
  display: grid;
  place-items: center;
  width: 11px;
  height: 11px;
  border-radius: 50%;
  color: #fff;
  background: var(--coral);
  font-size: 8px;
  font-weight: 700;
}
.template-footer {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 18px;
  padding-top: 14px;
  border-top: 1px dashed var(--line);
}
.template-footer .note { color: var(--muted-2); font-size: 10px; }
.template-footer .btn { margin-left: auto; }

.template-format-strip {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 9px;
  margin: 18px 0 24px;
}
.format-box {
  padding: 13px 14px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--paper);
}
.format-box span { color: var(--coral); font-family: var(--mono); font-size: 9px; font-weight: 600; }
.format-box strong { display: block; margin: 4px 0 2px; font-size: 12.5px; }
.format-box p { margin: 0; color: var(--muted); font-size: 10.5px; line-height: 1.55; }

/* ---------------- Essays ---------------- */

.essay-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.essay-card {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 15px;
  background: var(--paper);
  box-shadow: var(--shadow-sm);
  text-decoration: none;
  color: var(--ink);
  transition: transform .18s, border-color .18s, box-shadow .18s;
}
.essay-card:hover { transform: translateY(-3px); border-color: var(--line-strong); box-shadow: var(--shadow-md); color: var(--ink); }
.essay-card-bar { height: 4px; background: var(--green-3); }
.essay-card-bar.part-a { background: var(--coral); }
.essay-card-body { display: flex; flex-direction: column; flex: 1; padding: 17px 18px 15px; }
.essay-card-top { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
.essay-card-top .type { color: var(--muted); font-size: 9.5px; font-weight: 600; letter-spacing: .04em; }
.essay-card-top .learned { margin-left: auto; color: var(--green-2); font-size: 9px; }
.essay-card h3 { margin: 0 0 6px; font-family: var(--serif); font-size: 18px; line-height: 1.35; }
.essay-card .excerpt {
  display: -webkit-box;
  overflow: hidden;
  margin: 0 0 13px;
  color: var(--muted);
  font-family: var(--serif);
  font-size: 12px;
  line-height: 1.6;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}
.essay-card-foot {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: auto;
  padding-top: 10px;
  border-top: 1px dashed var(--line);
  color: var(--muted-2);
  font-size: 9.5px;
}
.essay-card-foot .icon { width: 12px; height: 12px; }
.essay-card-foot .go { margin-left: auto; color: var(--green-2); font-weight: 600; }

.essay-detail { max-width: 1020px; margin: 0 auto; }
.back-link {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  margin-bottom: 18px;
  color: var(--muted);
  font-size: 11.5px;
  text-decoration: none;
}
.back-link:hover { color: var(--ink); }
.back-link .icon { width: 14px; height: 14px; }
.essay-head { margin-bottom: 22px; }
.essay-head-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.essay-head h1 {
  margin: 0 0 8px;
  font-family: var(--serif);
  font-size: clamp(30px, 3.8vw, 43px);
  letter-spacing: -.025em;
}
.essay-meta { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--muted); font-size: 11px; }
.essay-meta span { display: inline-flex; align-items: center; gap: 4px; }
.essay-meta .icon { width: 13px; height: 13px; }
.essay-actions { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 16px; }
.essay-actions .btn[data-active="true"] { color: var(--green); border-color: #b9d1c4; background: var(--mint-2); }

.chart-card { margin-bottom: 22px; padding: 20px 22px 17px; }
.chart-card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.chart-card-head h3 { margin: 0; font-size: 13px; }
.chart-card-head p { margin: 2px 0 0; color: var(--muted-2); font-size: 10px; }
.chart-wrap { width: 100%; overflow-x: auto; }
.chart-svg { display: block; width: 100%; height: auto; min-width: 460px; }
.chart-note { margin: 8px 0 0; color: var(--muted-2); font-size: 9.5px; }
.chart-legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px; }
.chart-legend span { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); font-size: 10px; }
.chart-legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; }
.chart-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.chart-table th, .chart-table td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; }
.chart-table th { color: var(--muted); background: var(--paper-2); font-size: 10px; font-weight: 600; }
.chart-table tr:last-child td { border-bottom: 0; }

.essay-body {
  padding: 28px 30px;
  border: 1px solid var(--line);
  border-radius: 17px;
  background: var(--paper);
  box-shadow: var(--shadow-sm);
}
.essay-paragraph { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 26px; padding: 19px 0; border-top: 1px dashed var(--line); }
.essay-paragraph:first-child { padding-top: 0; border-top: 0; }
.essay-paragraph:last-child { padding-bottom: 0; }
.essay-en, .essay-zh { position: relative; }
.essay-en p {
  margin: 0;
  font-family: var(--serif);
  font-size: 18.5px;
  line-height: 1.85;
  letter-spacing: .002em;
  white-space: pre-wrap;
}
.essay-zh p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.95; white-space: pre-wrap; }
.para-label {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 22px;
  height: 18px;
  margin-right: 7px;
  padding: 0 5px;
  border-radius: 4px;
  color: var(--muted-2);
  background: var(--paper-3);
  font-family: var(--mono);
  font-size: 8.5px;
  vertical-align: 3px;
}
.essay-body.mode-en .essay-zh { display: none; }
.essay-body.mode-en .essay-paragraph { grid-template-columns: 1fr; }
.essay-body.mode-zh .essay-en { display: none; }
.essay-body.mode-zh .essay-paragraph { grid-template-columns: 1fr; }
.essay-body.mode-zh .essay-zh p { color: var(--ink-2); font-size: 14px; }
.essay-toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 10px;
}
.essay-toolbar .segmented { margin-right: auto; }

.essay-notes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 22px; }
.essay-notes > * { min-width: 0; }
.notes-card { padding: 20px 21px; }
.notes-card h3 {
  display: flex;
  align-items: center;
  gap: 6px;
  margin: 0 0 11px;
  font-size: 12px;
  font-weight: 700;
}
.notes-card h3 .icon { width: 15px; height: 15px; color: var(--green-2); }
.outline-list { display: flex; flex-direction: column; gap: 7px; }
.outline-row { display: flex; gap: 9px; font-size: 11.5px; line-height: 1.6; }
.outline-row b { flex: 0 0 28px; color: var(--coral); font-family: var(--mono); font-size: 9px; }
.outline-row span { color: var(--muted); }
.key-sentence-list { display: flex; flex-direction: column; gap: 8px; }
.key-sentence {
  padding: 10px 11px;
  border: 1px solid var(--line);
  border-left: 2px solid var(--amber-2);
  border-radius: 4px 8px 8px 4px;
  background: var(--paper-2);
}
.key-sentence .en { margin: 0 0 3px; font-family: var(--serif); font-size: 13px; line-height: 1.55; }
.key-sentence .zh { margin: 0 0 3px; color: var(--muted); font-size: 10.5px; }
.key-sentence .note { margin: 0; color: var(--green-2); font-size: 9.5px; line-height: 1.5; }
.takeaway-box {
  margin-top: 22px;
  padding: 18px 21px;
  border: 1px solid #e8ca80;
  border-radius: 13px;
  background: var(--amber-soft);
}
.takeaway-box b { display: block; margin-bottom: 3px; color: #80601b; font-size: 10px; letter-spacing: .08em; }
.takeaway-box p { margin: 0; color: #6f561f; font-size: 13px; line-height: 1.7; }
.essay-pager {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin-top: 24px;
  padding-top: 18px;
  border-top: 1px solid var(--line);
}
.essay-pager a {
  display: flex;
  flex-direction: column;
  max-width: 46%;
  color: var(--muted);
  font-size: 10px;
  text-decoration: none;
}
.essay-pager a.next { text-align: right; margin-left: auto; }
.essay-pager strong { margin-top: 3px; color: var(--ink-2); font-size: 12px; font-weight: 600; }

/* ---------------- Predictions ---------------- */

.prediction-summary { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0 0 8px; }
.prediction-section { margin-top: 30px; }
.prediction-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }
.prediction-card {
  display: flex;
  flex-direction: column;
  padding: 19px 20px 15px;
  border: 1px solid var(--line);
  border-radius: 15px;
  background: var(--paper);
  box-shadow: var(--shadow-sm);
  color: var(--ink);
  text-decoration: none;
  transition: transform .18s, border-color .18s, box-shadow .18s;
}
.prediction-card:hover { transform: translateY(-3px); border-color: var(--line-strong); box-shadow: var(--shadow-md); color: var(--ink); }
.prediction-top { display: flex; align-items: center; gap: 6px; margin-bottom: 9px; flex-wrap: wrap; }
.prediction-card h3 { margin: 0 0 6px; font-family: var(--serif); font-size: 19px; line-height: 1.4; }
.prediction-prompt {
  display: -webkit-box;
  overflow: hidden;
  margin: 0 0 10px;
  color: var(--muted);
  font-size: 10.5px;
  line-height: 1.65;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
}
.prediction-key {
  margin: 0 0 12px;
  padding: 9px 11px;
  border: 1px solid var(--line);
  border-left: 2px solid var(--amber-2);
  border-radius: 4px 8px 8px 4px;
  color: var(--ink-2);
  background: var(--paper-2);
  font-family: var(--serif);
  font-size: 13px;
  line-height: 1.55;
}
.prediction-key .icon { width: 12px; height: 12px; margin-right: 4px; color: var(--amber-2); vertical-align: -1px; }
.prediction-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-top: auto;
  padding-top: 9px;
  border-top: 1px dashed var(--line);
  color: var(--muted-2);
  font-size: 9.5px;
}
.prediction-foot span { display: inline-flex; align-items: center; gap: 3px; }
.prediction-foot .icon { width: 12px; height: 12px; }

/* ---------------- Practice ---------------- */

.practice-layout {
  display: grid;
  grid-template-columns: 345px minmax(0, 1fr);
  gap: 16px;
  align-items: start;
}
.practice-side { position: sticky; top: 96px; }
.practice-label {
  display: block;
  margin-bottom: 6px;
  color: var(--muted);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .08em;
}
.practice-select { width: 100%; height: auto; min-height: 42px; padding-top: 7px; padding-bottom: 7px; }
.practice-meta { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
.practice-prompt {
  max-height: 230px;
  overflow-y: auto;
  margin-bottom: 15px;
  padding: 13px 14px;
  border-left: 3px solid var(--green-2);
  border-radius: 4px 9px 9px 4px;
  color: var(--ink-2);
  background: var(--paper-2);
  font-size: 11.5px;
  line-height: 1.7;
}
.practice-prompt p { margin: 0; }
.practice-timer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 13px;
  padding: 12px 13px;
  border: 1px dashed var(--line-strong);
  border-radius: 10px;
  background: rgba(250, 245, 233, .65);
}
.practice-timer > div:first-child { display: flex; flex-direction: column; }
.practice-timer span { color: var(--muted); font-size: 9px; letter-spacing: .06em; }
.practice-timer strong {
  margin-top: 2px;
  color: var(--ink);
  font-family: var(--mono);
  font-size: 25px;
  font-weight: 600;
  line-height: 1;
}
.practice-timer-actions { display: flex; flex-direction: column; gap: 4px; align-items: stretch; }

.practice-editor { padding: 20px 21px 15px; }
.practice-toolbar {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 14px;
  margin-bottom: 11px;
}
.practice-toolbar h2 { margin: 0; font-family: var(--serif); font-size: 20px; }
.practice-toolbar p { margin: 3px 0 0; color: var(--muted); font-size: 10px; }
.word-count {
  flex: 0 0 auto;
  padding: 5px 9px;
  border-radius: 999px;
  color: var(--muted);
  background: var(--paper-2);
  font-family: var(--mono);
  font-size: 10px;
  white-space: nowrap;
}
.word-count.is-ok { color: var(--green); background: var(--mint); }
.word-count.is-low { color: #8a6413; background: var(--amber-soft); }
.word-count.is-high { color: var(--coral); background: var(--coral-soft); }
.practice-textarea {
  display: block;
  width: 100%;
  min-height: 430px;
  padding: 18px 20px;
  border: 1px solid var(--line);
  border-radius: 11px;
  color: var(--ink);
  background-color: #fffdf8;
  background-image: linear-gradient(rgba(201, 189, 166, .17) 1px, transparent 1px);
  background-size: 100% 32px;
  font-family: var(--serif);
  font-size: 17px;
  line-height: 32px;
  resize: vertical;
  outline: none;
  transition: border-color .16s, box-shadow .16s;
}
.practice-textarea::placeholder { color: var(--muted-2); font-family: var(--sans); font-size: 12px; line-height: 1.8; }
.practice-textarea:focus { border-color: var(--green-3); box-shadow: 0 0 0 3px rgba(79, 139, 118, .12); }
.practice-actions {
  display: flex;
  align-items: center;
  gap: 7px;
  flex-wrap: wrap;
  margin-top: 10px;
}
.practice-save-note { margin-right: auto; color: var(--muted-2); font-size: 9.5px; }
.practice-checklist { margin-top: 14px; }
.practice-checklist-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0 22px;
  margin-top: 4px;
}
.practice-check-item { padding: 7px 0; }
.practice-check-item .task-copy strong { font-size: 11px; font-weight: 500; color: var(--ink-2); }

/* ---------------- Plan ---------------- */

.plan-intro {
  display: flex;
  align-items: center;
  gap: 30px;
  flex-wrap: wrap;
  padding: 28px 30px;
  border-radius: 20px;
  color: #f6efde;
  background-color: var(--green);
  background-image: radial-gradient(circle at 90% 10%, rgba(240, 196, 91, .18), transparent 34%);
}
.plan-intro h2 { margin: 0 0 5px; font-family: var(--serif); font-size: 27px; }
.plan-intro p { margin: 0; color: rgba(246, 239, 222, .62); font-size: 12.5px; line-height: 1.7; }
.plan-intro .days-left { margin-left: auto; text-align: center; }
.plan-intro .days-left strong { display: block; color: var(--amber); font-family: var(--serif); font-size: 56px; line-height: .9; }
.plan-intro .days-left span { color: rgba(246, 239, 222, .48); font-size: 10px; }

.anchor-nav { display: flex; flex-wrap: wrap; gap: 6px; margin: 20px 0 0; }
.anchor-nav a { padding: 5px 9px; border: 1px solid var(--line); border-radius: 6px; color: var(--muted); background: var(--paper); font-size: 10px; text-decoration: none; }
.anchor-nav a:hover { color: var(--ink); border-color: var(--line-strong); }

.day-list { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 9px; }
.day-card {
  display: flex;
  flex-direction: column;
  padding: 15px 13px 12px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--paper);
}
.day-card .day-no { color: var(--coral); font-family: var(--mono); font-size: 9.5px; font-weight: 600; }
.day-card h3 { margin: 5px 0 8px; font-size: 12.5px; line-height: 1.4; }
.day-card ul { margin: 0 0 11px; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 5px; }
.day-card li { position: relative; padding-left: 11px; color: var(--muted); font-size: 10px; line-height: 1.55; }
.day-card li::before { content: ""; position: absolute; left: 0; top: 7px; width: 3px; height: 3px; border-radius: 50%; background: var(--green-3); }
.day-card .day-output {
  margin-top: auto;
  padding-top: 8px;
  border-top: 1px dashed var(--line);
  color: var(--green-2);
  font-size: 9px;
  line-height: 1.5;
}
.day-card .day-output b { display: block; margin-bottom: 1px; font-size: 8px; letter-spacing: .08em; }

.week-list { display: flex; flex-direction: column; gap: 9px; }
.week-row {
  display: grid;
  grid-template-columns: 78px minmax(0, 170px) minmax(0, 1fr) 160px;
  gap: 16px;
  align-items: center;
  padding: 15px 18px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--paper);
}
.week-row .week-no { color: var(--coral); font-family: var(--mono); font-size: 10px; font-weight: 600; }
.week-row h3 { margin: 0; font-family: var(--serif); font-size: 18px; }
.week-row .week-focus { display: flex; flex-wrap: wrap; gap: 5px; }
.week-row .week-focus span { padding: 2px 7px; border-radius: 4px; color: var(--muted); background: var(--paper-2); font-size: 9.5px; }
.week-row .week-check { color: var(--green-2); font-size: 10.5px; line-height: 1.5; }
.week-row .week-check b { display: block; color: var(--muted-2); font-size: 8.5px; letter-spacing: .08em; }

.routine-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.routine-card { padding: 19px 20px; }
.routine-card .time { display: flex; align-items: baseline; gap: 6px; }
.routine-card .time strong { font-family: var(--serif); font-size: 28px; }
.routine-card .time span { color: var(--muted); font-size: 10px; }
.routine-card .mode { display: inline-block; margin-bottom: 11px; padding: 2px 7px; border-radius: 4px; color: var(--green); background: var(--mint); font-size: 9px; font-weight: 600; }
.routine-card ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 5px; }
.routine-card li { position: relative; padding-left: 13px; color: var(--muted); font-size: 10.5px; line-height: 1.55; }
.routine-card li::before { content: "→"; position: absolute; left: 0; color: var(--green-3); }

.method-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 11px; }
.method-card { padding: 18px 19px; }
.method-no { color: var(--amber-2); font-family: var(--serif); font-size: 28px; font-weight: 700; line-height: 1; }
.method-card h3 { margin: 8px 0 5px; font-size: 13px; }
.method-card p { margin: 0 0 7px; color: var(--muted); font-size: 10.5px; line-height: 1.65; }
.method-card .tip { color: var(--green-2); font-size: 9.5px; line-height: 1.5; }

.rhythm-table, .score-table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
.rhythm-table th, .rhythm-table td, .score-table th, .score-table td { padding: 9px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.rhythm-table th, .score-table th { color: var(--muted); background: var(--paper-2); font-size: 9.5px; font-weight: 600; letter-spacing: .04em; }
.rhythm-table td:first-child { color: var(--coral); font-family: var(--mono); font-size: 10px; white-space: nowrap; }
.score-table td:first-child { color: var(--green); font-weight: 600; white-space: nowrap; }
.score-table td:last-child { color: var(--muted); }
.table-shell { min-width: 0; overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); }
.table-shell table { min-width: 540px; }
.table-shell tr:last-child td { border-bottom: 0; }

.exam-steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.exam-step { position: relative; padding: 16px 17px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); }
.exam-step .time { color: var(--coral); font-family: var(--mono); font-size: 9.5px; font-weight: 600; }
.exam-step h3 { margin: 5px 0; font-size: 13px; }
.exam-step p { margin: 0; color: var(--muted); font-size: 10.5px; line-height: 1.6; }

.reason-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 9px; }
.reason-card { padding: 15px 14px; }
.reason-card h3 { margin: 0 0 2px; font-family: var(--serif); font-size: 17px; }
.reason-card > span { color: var(--muted); font-size: 9.5px; }
.reason-card ul { margin: 10px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; }
.reason-card li { color: var(--ink-2); font-size: 10px; line-height: 1.5; }
.reason-card li::before { content: "· "; color: var(--coral); }

.mistake-list { display: flex; flex-direction: column; gap: 7px; }
.mistake-item {
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--paper);
}
.mistake-item summary {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 11px 13px;
  cursor: pointer;
  list-style: none;
  font-size: 11.5px;
}
.mistake-item summary::-webkit-details-marker { display: none; }
.mistake-item summary::before {
  content: "×";
  display: grid;
  place-items: center;
  width: 18px;
  height: 18px;
  flex: 0 0 auto;
  border-radius: 50%;
  color: #fff;
  background: var(--coral);
  font-size: 10px;
}
.mistake-item summary .wrong { color: var(--coral); text-decoration: line-through; text-decoration-color: #dca594; }
.mistake-item summary .right { color: var(--green-2); }
.mistake-item .why { padding: 0 13px 11px 40px; color: var(--muted); font-size: 10.5px; line-height: 1.6; }

.checklist-box { padding: 22px 24px; }
.checklist-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px 20px; }
.check-item { display: flex; align-items: flex-start; gap: 8px; padding: 5px 0; border-bottom: 1px dashed var(--line); color: var(--ink-2); font-size: 11px; line-height: 1.55; }
.check-item .box { width: 15px; height: 15px; flex: 0 0 auto; margin-top: 1px; border: 1.5px solid var(--line-strong); border-radius: 4px; background: #fff; }
.print-row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

/* ---------------- Quiz ---------------- */

.quiz-setup-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.quiz-mode-card {
  position: relative;
  display: flex;
  flex-direction: column;
  padding: 20px 21px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--paper);
  text-align: left;
  transition: transform .18s, border-color .18s, box-shadow .18s;
}
.quiz-mode-card:hover { transform: translateY(-2px); border-color: var(--line-strong); box-shadow: var(--shadow-md); }
.quiz-mode-card .quiz-mode-top { display: flex; align-items: center; gap: 9px; margin-bottom: 9px; }
.quiz-mode-icon { display: grid; place-items: center; width: 35px; height: 35px; border-radius: 9px; color: var(--green); background: var(--mint); }
.quiz-mode-icon .icon { width: 17px; height: 17px; }
.quiz-mode-card h3 { margin: 0; font-size: 15px; }
.quiz-mode-card p { margin: 0 0 13px; color: var(--muted); font-size: 10.5px; line-height: 1.6; }
.quiz-mode-card .meta { display: flex; align-items: center; gap: 8px; margin-top: auto; color: var(--muted-2); font-size: 9.5px; }
.quiz-mode-card .best { margin-left: auto; color: var(--green-2); font-weight: 600; }

.quiz-shell { max-width: 780px; margin: 0 auto; }
.quiz-top { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.quiz-top .quiz-progress-text { margin-left: auto; color: var(--muted); font-family: var(--mono); font-size: 10.5px; }
.quiz-progress { height: 5px; margin-bottom: 22px; overflow: hidden; border-radius: 999px; background: var(--line); }
.quiz-progress span { display: block; height: 100%; border-radius: 999px; background: var(--green-2); transition: width .3s; }
.quiz-question-label { margin-bottom: 8px; color: var(--coral); font-size: 9.5px; font-weight: 600; letter-spacing: .1em; }
.quiz-question { margin: 0 0 18px; font-family: var(--serif); font-size: 23px; line-height: 1.5; }
.quiz-options { display: flex; flex-direction: column; gap: 8px; }
.quiz-option {
  display: flex;
  align-items: flex-start;
  gap: 11px;
  padding: 13px 15px;
  border: 1px solid var(--line);
  border-radius: 10px;
  color: var(--ink-2);
  background: var(--paper);
  text-align: left;
  font-size: 13px;
  transition: border-color .16s, background .16s;
}
.quiz-option:hover:not(:disabled) { border-color: var(--green-3); background: var(--mint-2); }
.quiz-option .key {
  display: grid;
  place-items: center;
  width: 23px;
  height: 23px;
  flex: 0 0 auto;
  border-radius: 6px;
  color: var(--muted);
  background: var(--paper-2);
  font-family: var(--mono);
  font-size: 10px;
}
.quiz-option.correct { border-color: #9cc6ae; background: var(--mint-2); }
.quiz-option.correct .key { color: #fff; background: var(--green-2); }
.quiz-option.wrong { border-color: #e4b5a6; background: #fdf1ec; }
.quiz-option.wrong .key { color: #fff; background: var(--coral); }
.quiz-option:disabled { cursor: default; }
.quiz-feedback {
  margin-top: 15px;
  padding: 13px 15px;
  border: 1px solid #d5e3da;
  border-radius: 10px;
  background: var(--mint-2);
  font-size: 11.5px;
  line-height: 1.75;
}
.quiz-feedback.wrong { border-color: #f0cbbd; background: #fdf1ec; }
.quiz-feedback b { color: var(--green); }
.quiz-nav { display: flex; align-items: center; gap: 9px; margin-top: 17px; }
.quiz-nav .btn { margin-left: auto; }

.quiz-result { text-align: center; padding: 32px 24px 28px; }
.score-ring {
  --p: 0;
  position: relative;
  display: grid;
  place-items: center;
  width: 128px;
  height: 128px;
  margin: 0 auto 16px;
  border-radius: 50%;
  background: conic-gradient(var(--green-2) calc(var(--p) * 1%), var(--paper-3) 0);
}
.score-ring::before { content: ""; position: absolute; inset: 9px; border-radius: 50%; background: var(--paper); }
.score-ring strong { position: relative; z-index: 1; font-family: var(--serif); font-size: 39px; line-height: 1; }
.score-ring span { position: relative; z-index: 1; display: block; margin-top: 2px; color: var(--muted); font-size: 9px; }
.quiz-result .hero-actions { margin-top: 4px; }
.quiz-result .hero-actions .btn-secondary {
  color: var(--ink);
  border-color: var(--line-strong);
  background: var(--paper);
}
.quiz-result .hero-actions .btn-secondary:hover { color: var(--ink); border-color: var(--ink-2); background: #fff; }
.quiz-result h2 { margin: 0 0 5px; font-family: var(--serif); font-size: 26px; }
.quiz-result > p { margin: 0 0 18px; color: var(--muted); font-size: 12px; }
.quiz-review { margin-top: 22px; text-align: left; }
.quiz-review h3 { margin: 0 0 9px; font-size: 11px; letter-spacing: .06em; }
.review-item { padding: 10px 0; border-top: 1px dashed var(--line); font-size: 11px; line-height: 1.6; }
.review-item .q { margin: 0 0 3px; color: var(--ink-2); }
.review-item .a { margin: 0; color: var(--green-2); }
.review-item .a span { color: var(--muted); }
.review-item .exp { margin: 3px 0 0; color: var(--muted); font-size: 10px; }

/* ---------------- Training / GitHub-style dashboard ---------------- */

.training-banner {
  display: grid;
  grid-template-columns: minmax(0, 1.25fr) minmax(210px, .7fr) auto;
  gap: 26px;
  align-items: center;
  margin-top: 38px;
  padding: 26px 28px;
  border-radius: 20px;
  color: #f6efde;
  background-color: #1b4a3d;
  background-image:
    radial-gradient(circle at 96% 0, rgba(240, 196, 91, .19), transparent 34%),
    radial-gradient(rgba(255, 255, 255, .045) 1px, transparent 1px);
  background-size: auto, 18px 18px;
  overflow: hidden;
}
.training-banner .eyebrow { margin-bottom: 8px; color: var(--amber); }
.training-banner .eyebrow::before { background: var(--amber); }
.training-banner h2 {
  margin: 0 0 4px;
  font-family: var(--serif);
  font-size: 26px;
  letter-spacing: -.01em;
}
.training-banner p { margin: 0 0 12px; color: rgba(246, 239, 222, .62); font-size: 11.5px; }
.challenge-dots { display: flex; gap: 7px; margin-bottom: 13px; }
.challenge-dots span {
  display: grid;
  place-items: center;
  width: 25px;
  height: 25px;
  border: 1px solid rgba(246, 239, 222, .24);
  border-radius: 7px;
  color: rgba(246, 239, 222, .5);
  font-family: var(--mono);
  font-size: 9px;
}
.challenge-dots span.done {
  color: var(--green);
  border-color: var(--amber);
  background: var(--amber);
}
.training-banner-meta { display: flex; flex-wrap: wrap; gap: 6px 14px; color: rgba(246, 239, 222, .55); font-size: 10px; }
.training-banner-meta span { display: inline-flex; align-items: center; gap: 4px; }
.training-banner-meta .icon { width: 12px; height: 12px; }
.training-banner-heat {
  padding: 12px 13px 9px;
  border-radius: 12px;
  color: var(--ink);
  background: var(--paper);
}
.training-banner-heat > span { display: block; margin-top: 6px; color: var(--muted-2); font-size: 8.5px; letter-spacing: .04em; }
.training-banner-action { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
.training-banner-action .btn { white-space: nowrap; }
.training-banner-action .section-link { color: rgba(246, 239, 222, .65); }

/* heatmap */

.heatmap { display: flex; align-items: flex-end; gap: 7px; min-width: 0; }
.heatmap-weekdays {
  display: grid;
  grid-template-rows: repeat(7, 12px);
  gap: 3px;
  color: var(--muted-2);
  font-size: 8px;
  line-height: 12px;
  text-align: right;
}
.heatmap-body { display: flex; flex-direction: column; min-width: 0; }
.heatmap-grid {
  display: grid;
  grid-template-rows: repeat(7, 12px);
  grid-auto-flow: column;
  grid-auto-columns: 12px;
  gap: 3px;
}
.heat-cell {
  display: block;
  width: 12px;
  height: 12px;
  border-radius: 3px;
  background: #eee7d8;
}
.heat-cell.lv-1 { background: #cfe4d8; }
.heat-cell.lv-2 { background: #91c2a8; }
.heat-cell.lv-3 { background: #4f9677; }
.heat-cell.lv-4 { background: #1f6650; }
.heat-cell.is-today { outline: 1.5px solid var(--coral); outline-offset: 1px; }
.heatmap-legend { display: flex; align-items: center; justify-content: flex-end; gap: 3px; margin-top: 7px; color: var(--muted-2); font-size: 8.5px; }
.heatmap-legend span { margin: 0 3px; }
.heatmap-legend i { width: 10px; height: 10px; border-radius: 2px; }
.heatmap-compact .heatmap-grid { grid-template-rows: repeat(7, 9px); grid-auto-columns: 9px; gap: 2px; }
.heatmap-compact .heatmap-weekdays { grid-template-rows: repeat(7, 9px); gap: 2px; font-size: 7px; line-height: 9px; }
.heatmap-compact .heat-cell { width: 9px; height: 9px; border-radius: 2px; }
.heatmap-compact .heatmap-legend { display: none; }
.heatmap-compact { gap: 5px; }
.heatmap-tip { margin-top: 10px; color: var(--muted); font-size: 10.5px; }

/* drill dashboard */

.drill-dashboard {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-bottom: 14px;
}
.drill-stat {
  padding: 14px 16px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--paper);
  box-shadow: var(--shadow-sm);
}
.drill-stat span { display: block; color: var(--muted); font-size: 9.5px; letter-spacing: .03em; }
.drill-stat strong { display: block; margin-top: 3px; font-family: var(--serif); font-size: 25px; line-height: 1.1; }
.drill-stat strong small { margin-left: 3px; color: var(--muted-2); font-family: var(--sans); font-size: 9px; font-weight: 400; }

.daily-challenge-card {
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 22px;
  padding: 23px 26px;
  border-radius: 17px;
  color: #f6efde;
  background-color: var(--green);
  background-image: radial-gradient(circle at 92% 0, rgba(240, 196, 91, .22), transparent 34%);
}
.daily-challenge-card .eyebrow { margin-bottom: 6px; color: var(--amber); }
.daily-challenge-card .eyebrow::before { background: var(--amber); }
.daily-challenge-card h2 { margin: 0 0 3px; font-family: var(--serif); font-size: 25px; }
.daily-challenge-card p { margin: 0 0 10px; color: rgba(246, 239, 222, .62); font-size: 11.5px; }
.daily-challenge-card .challenge-dots { margin-bottom: 0; }
.daily-challenge-side { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
.daily-challenge-side .tag { color: rgba(246, 239, 222, .6); border-color: rgba(246, 239, 222, .15); background: rgba(255, 255, 255, .05); }
.drill-section-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 14px;
  margin: 26px 0 12px;
}
.drill-section-head h2 { margin: 0; font-family: var(--serif); font-size: 22px; }
.drill-section-head span { color: var(--muted); font-size: 10.5px; }
.drill-history { margin-top: 22px; padding: 18px 20px; }
.drill-history-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 14px;
  margin-bottom: 14px;
}
.drill-history-head h2, .drill-history-head h3 { margin: 0; font-family: var(--serif); font-size: 19px; }
.drill-history-head p { margin: 2px 0 0; color: var(--muted); font-size: 10.5px; }
.drill-history > .heatmap { margin-top: 3px; }
.quiz-streak {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 3px 7px;
  border-radius: 5px;
  color: var(--coral);
  background: var(--coral-soft);
  font-size: 9.5px;
  font-weight: 600;
}
.quiz-streak .icon { width: 12px; height: 12px; }
.feedback-sub { color: var(--muted); font-size: 10px; }
.daily-done-note {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  margin: 2px 0 13px;
  padding: 4px 9px;
  border-radius: 6px;
  color: var(--green);
  background: var(--mint-2);
  font-size: 10.5px;
}
.daily-done-note .icon { width: 13px; height: 13px; }
.quiz-mode-card.is-wrong { border-color: #e9c5b8; background: linear-gradient(180deg, #fffaf7, var(--paper)); }
.quiz-mode-card:disabled { opacity: .52; cursor: not-allowed; transform: none; }

/* stats page */

.stats-overview {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
  margin-bottom: 14px;
}
.stats-card {
  position: relative;
  display: flex;
  flex-direction: column;
  min-height: 103px;
  padding: 15px 17px;
  border: 1px solid var(--line);
  border-radius: 13px;
  background: var(--paper);
  box-shadow: var(--shadow-sm);
}
.stats-icon {
  position: absolute;
  top: 14px;
  right: 14px;
  display: grid;
  place-items: center;
  width: 29px;
  height: 29px;
  border-radius: 8px;
  color: var(--green);
  background: var(--mint-2);
}
.stats-icon .icon { width: 15px; height: 15px; }
.stats-label { color: var(--muted); font-size: 10px; }
.stats-value { margin-top: 10px; font-family: var(--serif); font-size: 29px; line-height: 1; }
.stats-value small { margin-left: 3px; color: var(--muted-2); font-family: var(--sans); font-size: 9px; font-weight: 400; }
.stats-card.tone-amber .stats-icon { color: #8a6413; background: var(--amber-soft); }
.stats-card.tone-blue .stats-icon { color: var(--blue); background: var(--blue-soft); }
.stats-card.tone-purple .stats-icon { color: var(--purple); background: var(--purple-soft); }
.heatmap-card { padding: 21px 23px; }
.heatmap-card > .heatmap { margin: 4px 0 0; }
.stats-two-col {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-top: 14px;
}
.skill-card, .achievement-card { padding: 21px 23px; }
.skill-list { display: flex; flex-direction: column; gap: 13px; }
.skill-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 11px; }
.skill-top span:first-child { font-weight: 600; }
.skill-top span:last-child { color: var(--muted); font-family: var(--mono); font-size: 9.5px; }
.skill-bar { height: 6px; margin: 5px 0 4px; overflow: hidden; border-radius: 99px; background: var(--paper-3); }
.skill-bar span { display: block; height: 100%; border-radius: 99px; background: var(--green-3); transition: width .35s; }
.skill-meta { display: flex; justify-content: space-between; color: var(--muted-2); font-size: 9px; }
.achievement-grid { display: grid; grid-template-columns: 1fr; gap: 6px; }
.achievement {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 8px 9px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: var(--paper-2);
  opacity: .68;
}
.achievement.is-on { border-color: #cfe0d4; background: var(--mint-2); opacity: 1; }
.ach-icon { display: grid; place-items: center; width: 27px; height: 27px; flex: 0 0 auto; border-radius: 7px; color: var(--muted); background: var(--paper-3); }
.achievement.is-on .ach-icon { color: var(--green); background: #cfe7d8; }
.ach-icon .icon { width: 14px; height: 14px; }
.achievement div { display: flex; flex-direction: column; min-width: 0; line-height: 1.3; }
.achievement strong { font-size: 10.5px; }
.achievement div span { color: var(--muted); font-size: 8.5px; }
.achievement em { margin-left: auto; color: var(--muted-2); font-size: 8px; font-style: normal; white-space: nowrap; }
.achievement.is-on em { color: var(--green-2); }
.wrong-preview-card { margin-top: 14px; padding: 21px 23px; }
.wrong-preview-list { display: flex; flex-direction: column; gap: 8px; }
.wrong-preview { padding: 10px 12px; border: 1px solid var(--line); border-left: 2px solid var(--coral); border-radius: 4px 8px 8px 4px; background: var(--paper-2); }
.wrong-preview-q { color: var(--ink-2); font-size: 11px; line-height: 1.55; }
.wrong-preview-a { margin-top: 3px; color: var(--green-2); font-size: 10px; line-height: 1.5; }
.empty-inline { display: flex; align-items: center; gap: 7px; padding: 12px; border: 1px dashed var(--line-strong); border-radius: 9px; color: var(--muted); font-size: 10.5px; }
.empty-inline .icon { width: 15px; height: 15px; color: var(--green-2); }

/* ---------------- About ---------------- */

.about-grid { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, .7fr); gap: 22px; align-items: start; }
.prose-card { padding: 27px 30px; }
.prose-card h2 { margin: 0 0 12px; font-family: var(--serif); font-size: 24px; }
.prose-card h3 { margin: 24px 0 8px; font-size: 14px; }
.prose-card p { margin: 0 0 11px; color: var(--ink-2); font-size: 12.5px; line-height: 1.85; }
.prose-card ul { margin: 0 0 11px; padding-left: 18px; color: var(--ink-2); font-size: 12px; line-height: 1.8; }
.prose-card li { margin-bottom: 3px; }
.about-side { display: flex; flex-direction: column; gap: 12px; }
.source-list { display: flex; flex-direction: column; gap: 8px; }
.source-row {
  display: flex;
  gap: 10px;
  padding: 10px 11px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: var(--paper-2);
  text-decoration: none;
}
.source-row:hover { border-color: var(--line-strong); }
.source-row .icon { width: 14px; height: 14px; margin-top: 2px; color: var(--green-2); }
.source-row div { display: flex; flex-direction: column; }
.source-row strong { color: var(--ink); font-size: 11px; }
.source-row span { color: var(--muted); font-size: 9.5px; line-height: 1.5; }
.notice-list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 7px; }
.notice-list li { position: relative; padding-left: 14px; color: var(--muted); font-size: 10.5px; line-height: 1.6; }
.notice-list li::before { content: "•"; position: absolute; left: 2px; color: var(--coral); }
.faq-list { display: flex; flex-direction: column; gap: 7px; }
.faq-item { border: 1px solid var(--line); border-radius: 10px; background: var(--paper); }
.faq-item summary { padding: 11px 13px; cursor: pointer; list-style: none; font-size: 11.5px; font-weight: 600; }
.faq-item summary::-webkit-details-marker { display: none; }
.faq-item summary::after { content: "+"; float: right; color: var(--muted); font-weight: 400; }
.faq-item[open] summary::after { content: "−"; }
.faq-item .answer { padding: 0 13px 12px; color: var(--muted); font-size: 10.5px; line-height: 1.7; }

/* ---------------- Modal / toast / empty ---------------- */

.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: grid;
  place-items: center;
  padding: 22px;
  background: rgba(14, 31, 24, .52);
  backdrop-filter: blur(4px);
  animation: fade-in .18s ease both;
}
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
.modal {
  position: relative;
  width: min(780px, 100%);
  max-height: min(88vh, 900px);
  overflow-y: auto;
  padding: 26px 28px 24px;
  border: 1px solid var(--line);
  border-radius: 20px;
  background: var(--bg);
  box-shadow: var(--shadow-lg);
  animation: modal-in .24s cubic-bezier(.2, .8, .2, 1) both;
}
@keyframes modal-in { from { opacity: 0; transform: translateY(10px) scale(.985); } to { opacity: 1; transform: none; } }
.modal-close { position: absolute; top: 14px; right: 14px; z-index: 2; }
.modal-head { padding-right: 36px; margin-bottom: 15px; }
.modal-head .eyebrow { margin-bottom: 7px; }
.modal-head h2 { margin: 0 0 4px; font-family: var(--serif); font-size: 26px; }
.modal-head p { margin: 0; color: var(--muted); font-size: 11.5px; }
.modal-wide { width: min(900px, 100%); }

.toast {
  position: fixed;
  left: 50%;
  bottom: 28px;
  max-width: calc(100vw - 32px);
  text-align: center;
  z-index: 200;
  padding: 9px 16px;
  border-radius: 999px;
  color: #fff8e8;
  background: rgba(23, 41, 34, .94);
  box-shadow: 0 10px 30px rgba(15, 30, 24, .2);
  font-size: 11.5px;
  opacity: 0;
  pointer-events: none;
  transform: translate(-50%, 10px);
  transition: opacity .2s, transform .2s;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

.empty-state {
  padding: 45px 24px;
  border: 1px dashed var(--line-strong);
  border-radius: 14px;
  color: var(--muted);
  background: rgba(255, 253, 247, .55);
  text-align: center;
  font-size: 12.5px;
  line-height: 1.8;
}
.empty-state strong { display: block; margin-bottom: 4px; color: var(--ink-2); font-family: var(--serif); font-size: 19px; }
.empty-state .btn { margin-top: 14px; }

/* mark highlight */
.hl { background: linear-gradient(transparent 55%, rgba(240, 196, 91, .6) 55% 92%, transparent 92%); }
